# 관련 법령 개정 자동 확인: 매주 월요일 오전 9시(한국 시간)에 실행하고, 바뀌면 이슈를 만든다
name: 법령 개정 확인

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-laws:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: 법령 개정 확인
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
        run: node scripts/check-laws.mjs

      - name: 개정 내용으로 이슈 만들기
        if: hashFiles('law-changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚖️ 관련 법령 개정 확인 필요 ($(date -u +%Y-%m-%d))" \
            --body-file law-changes.md

      - name: 법령 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/law-versions.json
          if git diff --cached --quiet; then
            echo "저장할 변경이 없습니다."
          else
            git commit -m "법령 개정 기록 갱신 (자동)"
            git push
          fi

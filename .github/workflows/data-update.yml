# 파일로 넣어 둔 공공데이터 자동 갱신: 매달 1일 오전 9시(한국 시간)
# - 시추공(공공데이터포털), 조사기관 연락처(한국문화유산협회), 담당 부서(행정표준코드 기관코드)를 새로 받아서 바뀌었을 때만 저장
# - 받기에 실패하면 이슈로 알리고, 다음에 모두 성공하면 그 이슈를 닫음
# - 다시 확인할 때는 Actions에서 "Re-run"이 아니라 "Run workflow"로 실행 (Re-run은 예전 코드로 돌아감)
name: 자료 자동 갱신

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: 좌표 변환 라이브러리 설치
        run: npm i --no-save proj4@2.11.0

      - name: 시추공 자료 갱신
        id: boreholes
        continue-on-error: true
        run: node scripts/update-boreholes.mjs

      # 한국문화유산협회 사이트가 중간 인증서를 빼고 보내서 리눅스에서는 접속이 거부됨 (윈도우는 알아서 받아 옴)
      # 인증서에 적힌 주소(AIA)에서 빠진 중간 인증서를 받아, 시스템이 믿는 루트로 이어지는지 확인한 뒤에만 씀
      - name: 협회 사이트 중간 인증서 보완
        continue-on-error: true
        run: |
          set -e
          cd "$RUNNER_TEMP"
          aia() { openssl x509 -in "$1" -noout -ext authorityInfoAccess | tr -d '\r' | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p'; }
          echo | openssl s_client -connect www.kaah.kr:443 -servername www.kaah.kr 2>/dev/null > leaf.txt
          curl -sf -o inter.der "$(aia leaf.txt)" && openssl x509 -inform der -in inter.der -out inter.pem
          curl -sf -o parent.der "$(aia inter.pem)" && openssl x509 -inform der -in parent.der -out parent.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted parent.pem inter.pem
          cat inter.pem parent.pem > kaah-chain.pem
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/kaah-chain.pem" >> "$GITHUB_ENV"

      - name: 조사기관 연락처 갱신
        id: agencies
        continue-on-error: true
        run: node --use-system-ca scripts/update-agencies.mjs

      - name: 담당 부서 자료 갱신
        id: departments
        continue-on-error: true
        run: node scripts/update-departments.mjs

      - name: 바뀐 자료 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boreholes.bin.gz data/boreholes-meta.json data/agencies.json data/departments.json
          if git diff --cached --quiet; then
            echo "바뀐 자료가 없습니다."
          else
            git commit -m "공공데이터 자료 갱신 (자동)"
            git push
          fi

      - name: 실패하면 이슈 만들기
        if: steps.boreholes.outcome == 'failure' || steps.agencies.outcome == 'failure' || steps.departments.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ 자료 자동 갱신 실패 ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --body "$(printf '시추공: %s\n조사기관 연락처: %s\n담당 부서: %s\n\n실행 기록: %s\n\n사이트가 해외 접속을 막거나 내려받기 방식이 바뀌었을 수 있어요. 파일을 직접 받아 `node scripts/update-boreholes.mjs 파일.csv`, `node scripts/update-departments.mjs 파일.zip`으로 갱신할 수 있어요.' \
              '${{ steps.boreholes.outcome }}' '${{ steps.agencies.outcome }}' '${{ steps.departments.outcome }}' \
              '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"

      - name: 모두 성공하면 이전 실패 이슈 닫기
        if: steps.boreholes.outcome == 'success' && steps.agencies.outcome == 'success' && steps.departments.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search "자료 자동 갱신 실패 in:title" --json number --jq '.[].number' | while read -r issue; do
            gh issue close "$issue" --comment "다시 실행해서 모두 성공했어요."
          done

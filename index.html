<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>땅파기전</title>
    
    <!-- 1. Leaflet CSS 스타일 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- 아이콘 (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        body {
            margin: 8px;
            font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
        }

        /* 지도를 담을 div는 반드시 높이(height)가 있어야 함! */
        #map {
            width: 100%;
            height: 480px;
        }

        /* 검색창: 화면이 좁으면 칸이 줄어듦 */
        #search-box .search-row {
            display: flex;
            gap: 6px;
            max-width: 420px;
        }
        #address-input {
            flex: 1;
            min-width: 0;
            padding: 8px;
            font-size: 14px;
        }
        #search-btn {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 팝업의 "해야 할 일 보기" 버튼 */
        .go-panel {
            margin-top: 8px;
            padding: 4px 10px;
            border: 1px solid #1d72b8;
            border-radius: 4px;
            background: white;
            color: #1d72b8;
            font-size: 12px;
            cursor: pointer;
        }
        .go-panel:hover {
            background: #1d72b8;
            color: white;
        }

        /* 휴대폰 화면 */
        @media (max-width: 600px) {
            body {
                margin: 0;
            }
            #map {
                height: 60vh;
            }
            #search-box,
            #result-panel,
            #data-source {
                margin-left: 8px !important;
                margin-right: 8px !important;
            }
            #search-box {
                margin-top: 8px !important;
            }
            #result-panel {
                padding: 10px 12px;
            }
            #result-panel .inputs label {
                width: 100%;
            }
            #result-panel .inputs input,
            #result-panel .inputs select {
                flex: 1;
            }
            /* 좁은 화면에서는 범례 글씨를 조금 줄임 */
            .map-legend {
                font-size: 11px;
                line-height: 17px;
            }
        }

        /* 지도 범례 */
        .map-legend {
            background: white;
            padding: 6px 10px;
            font-size: 12px;
            line-height: 20px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .map-legend .legend-title {
            display: block;
            width: 100%;
            margin-bottom: 2px;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
        }
        .map-legend.is-collapsed .legend-items {
            display: none;
        }
        .map-legend.is-collapsed .legend-title {
            margin-bottom: 0;
        }
        .map-legend.is-collapsed .legend-arrow {
            display: inline-block;
            transform: rotate(-90deg);
        }

        /* 터치 화면에서는 두 손가락으로 확대·축소하므로 +/- 버튼 숨김 */
        @media (pointer: coarse) {
            .leaflet-control-zoom {
                display: none;
            }
        }
        /* 내 위치 버튼 */
        .locate-button {
            font-size: 15px;
            color: #333;
        }
        .locate-button:hover {
            color: #1d72b8;
        }
        .locate-button.is-loading {
            cursor: wait;
        }
        .map-legend .swatch {
            display: inline-block;
            width: 14px;
            height: 12px;
            margin-right: 6px;
            vertical-align: middle;
            box-sizing: border-box;
        }

        /* 주소 검색 결과 목록 */
        #search-results {
            max-width: 420px;
            margin: 6px 0 0 0;
            padding: 0;
            list-style: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        #search-results li + li {
            border-top: 1px solid #eee;
        }
        #search-results button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            background: none;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
        }
        #search-results button:hover {
            background: #f3f7fb;
        }
        #search-results button span {
            display: block;
            color: #666;
            font-size: 12px;
        }
        #search-results .search-message {
            padding: 8px 10px;
            color: #666;
            font-size: 13px;
        }

        /* 진단 결과 패널 */
        #result-panel {
            max-width: 720px;
            margin: 0 0 12px 0;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }
        #result-panel h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        #result-panel h4 {
            margin: 14px 0 6px 0;
            font-size: 14px;
        }
        #result-panel .panel-sub {
            margin: 0;
            color: #666;
            font-size: 13px;
        }
        #result-panel .inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 10px;
            font-size: 13px;
        }
        #result-panel .inputs label {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #result-panel .inputs label[hidden] {
            display: none;
        }
        #result-panel .inputs input,
        #result-panel .inputs select {
            padding: 4px 6px;
            font-size: 13px;
        }
        #result-panel .inputs input {
            width: 100px;
        }
        .step {
            margin: 6px 0;
            padding: 8px 10px;
            border-left: 4px solid #ccc;
            background: #fafafa;
        }
        .step.required { border-left-color: #e63946; }
        .step.check { border-left-color: #e9a400; }
        .step.info { border-left-color: #2a9d8f; }
        .step.yes { border-left-color: #2a9d8f; }
        .step.no { border-left-color: #999; }
        .step.ask { border-left-color: #1d72b8; }
        .step-title {
            font-weight: bold;
        }
        .law {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }
        .law summary {
            cursor: pointer;
        }
        #result-panel ul.notes {
            margin: 0;
            padding-left: 18px;
        }
        #result-panel ul.surveys li {
            margin-bottom: 6px;
        }
        .survey-method {
            display: inline-block;
            padding: 0 6px;
            margin-right: 4px;
            border-radius: 3px;
            background: #eef3f8;
            color: #1d72b8;
            font-size: 12px;
        }
        .survey-report {
            color: #666;
            font-size: 12px;
        }
        #result-panel .disclaimer {
            margin: 14px 0 0 0;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>    
    <!-- 2. 지도가 들어갈 공간 -->
    <div id="map"></div>

    <!-- 주소 검색 UI 패널 -->
    <div id="search-box" style="margin-bottom: 10px; z-index: 1000; position: relative;">
        <div class="search-row">
            <input
                type="text"
                id="address-input"
                placeholder="지번, 도로명 또는 장소 (예: 경주시 인왕동 815-1)"
            >
            <button id="search-btn">검색</button>
        </div>
        <!-- 검색 결과가 여러 개일 때 고르는 목록 -->
        <ul id="search-results" hidden></ul>
    </div>

    <!-- 진단 결과 패널: 필지를 누르면 해야 할 일과 비용 안내 표시 -->
    <section id="result-panel" hidden></section>

    <!-- 데이터 출처 표시 -->
    <p id="data-source" style="margin: 0 0 10px 0; font-size: 12px; color: #666;">
        출처: 국가유산청 국가유산 공간정보서비스(문화유적분포지도, 국가유산조사구역), 국토교통부 브이월드(국가유산 지정/보호구역, 지적도), OpenStreetMap
    </p>

    <!-- 3. Leaflet 자바스크립트 불러오기 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 다음 단계 안내 규칙 -->
    <script src="guidance.js"></script>

    <script>
        // 지도 초기화 (서울 시청 위경도 좌표 [37.5665, 126.9780], 줌 레벨 13)
        const map = L.map('map').setView([37.5665, 126.9780], 13);

        // 오픈스트리트맵(무료 배경 지도) 입히기
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // VWorld 지적도 WMS 레이어 생성
        const cadastralLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',

                // BUBBLE이 아니라 BUBUN
                layers: 'lp_pa_cbnd_bubun,lp_pa_cbnd_bonbun',

                // 잘못된 스타일명을 보내지 않고 기본 스타일 사용
                styles: '',

                format: 'image/png',
                transparent: true,
                crs: L.CRS.EPSG3857,

                // VWorld는 줌 17 미만에서 빈 이미지를 보내므로 17부터 요청
                minZoom: 17,
                maxZoom: 19
            }
        ).addTo(map);

        // VWorld 국가유산 지정/보호구역 WMS 레이어 생성 (줌 10부터 표시됨)
        const heritageLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',
                layers: 'lt_c_uo301',
                styles: 'lt_c_uo301',
                format: 'image/png',
                transparent: true,
                opacity: 0.6,
                crs: L.CRS.EPSG3857,
                minZoom: 10,
                maxZoom: 19
            }
        ).addTo(map);

        // 국가유산청 문화유적분포지도 (줌 15부터 1.2km 칸 단위로 도형을 받아 그림)
        const SITES_MIN_ZOOM = 15;
        const sitesLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                // VWorld 보호구역(파란 빗금)과 구분되도록 보라색 사용
                color: '#7b2cbf',
                weight: 1.5,
                fillColor: '#9d4edd',
                fillOpacity: 0.25
            }
        }).addTo(map);
        const loadedSiteTiles = new Set();
        const loadedSiteIds = new Set();

        function loadSites() {
            if (!map.hasLayer(sitesLayer) || map.getZoom() < SITES_MIN_ZOOM) return;

            const bounds = map.getBounds();
            const min = map.project(bounds.getNorthWest(), SITES_MIN_ZOOM).divideBy(256).floor();
            const max = map.project(bounds.getSouthEast(), SITES_MIN_ZOOM).divideBy(256).floor();

            for (let x = min.x; x <= max.x; x++) {
                for (let y = min.y; y <= max.y; y++) {
                    const tileKey = `${x}/${y}`;
                    if (loadedSiteTiles.has(tileKey)) continue;
                    loadedSiteTiles.add(tileKey);

                    fetch(`/api/heritage-sites?x=${x}&y=${y}`)
                        .then(response => {
                            if (!response.ok) throw new Error('문화유적분포지도 조회 실패');
                            return response.json();
                        })
                        .then(data => {
                            // 여러 칸에 걸친 유적은 한 번만 그림
                            const newFeatures = data.features.filter(feature => !loadedSiteIds.has(feature.properties.id));
                            newFeatures.forEach(feature => loadedSiteIds.add(feature.properties.id));
                            sitesLayer.addData(newFeatures);
                        })
                        .catch(error => {
                            console.error('문화유적분포지도 불러오기 오류:', error);
                            loadedSiteTiles.delete(tileKey); // 다음 이동 때 다시 시도
                        });
                }
            }
        }

        map.on('moveend overlayadd', loadSites);
        loadSites();

        // 지도 컨트롤 버튼 생성
        const overlayMaps = {
            "지적도 표시": cadastralLayer,
            "국가유산 구역 표시": heritageLayer,
            "문화유적 분포 범위 표시": sitesLayer
        };
        L.control.layers(null, overlayMaps).addTo(map);

        // 범례: 지도 색깔이 무엇을 뜻하는지 표시 (VWorld 색은 GetLegendGraphic 기준)
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'map-legend');
            div.innerHTML = `
                <button type="button" class="legend-title" aria-expanded="true">범례 <span class="legend-arrow">▾</span></button>
                <div class="legend-items">
                    <div><span class="swatch" style="background: #ffff4d; border: 1px solid #c9c900;"></span>국가·시도 지정유산 구역</div>
                    <div><span class="swatch" style="background: repeating-linear-gradient(135deg, #4bb3e8 0 2px, #fff 2px 4px);"></span>보호구역</div>
                    <div><span class="swatch" style="border: 2px solid #4caf50;"></span>역사문화환경 보존지역</div>
                    <div><span class="swatch" style="background: rgba(157, 78, 221, 0.25); border: 1.5px solid #7b2cbf;"></span>문화유적 분포 범위</div>
                    <div><span class="swatch" style="border: 1.5px solid #e8a33d;"></span>지적도(필지 경계)</div>
                </div>
            `;

            // 제목을 누르면 접고 펼침. 휴대폰처럼 좁은 화면에서는 접힌 채로 시작
            const toggle = div.querySelector('.legend-title');
            const setOpen = (open) => {
                div.classList.toggle('is-collapsed', !open);
                toggle.setAttribute('aria-expanded', String(open));
            };
            setOpen(!window.matchMedia('(max-width: 600px)').matches);
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.on(toggle, 'click', () => setOpen(div.classList.contains('is-collapsed')));
            return div;
        };
        legend.addTo(map);

        // 켜져 있는 레이어가 현재 줌에서 안 보이면 안내 문구 표시
        const CADASTRAL_MIN_ZOOM = 17;
        const zoomHint = L.control({ position: 'bottomleft' });
        zoomHint.onAdd = function() {
            const div = L.DomUtil.create('div');
            div.style.cssText = 'background: white; padding: 6px 10px; font-size: 13px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);';
            return div;
        };

        function updateZoomHint() {
            const hidden = [];
            if (map.hasLayer(sitesLayer) && map.getZoom() < SITES_MIN_ZOOM) hidden.push('문화유적 분포 범위');
            if (map.hasLayer(cadastralLayer) && map.getZoom() < CADASTRAL_MIN_ZOOM) hidden.push('지적도');

            if (hidden.length > 0) {
                zoomHint.addTo(map);
                zoomHint.getContainer().textContent = `${hidden.join(', ')}는 더 확대하면 표시됩니다.`;
            } else {
                zoomHint.remove();
            }
        }

        map.on('zoomend overlayadd overlayremove', updateZoomHint);
        updateZoomHint();

        // 지도 위 핀은 하나만 유지 (내 위치, 검색, 클릭 중 마지막 것만 표시)
        let activeMarker = null;
        let parcelHighlight = null;

        function placeMarker(latlng) {
            if (activeMarker) map.removeLayer(activeMarker);
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = null;
            activeMarker = L.marker(latlng).addTo(map);
            return activeMarker;
        }

        // 진단한 필지를 지도에 강조 표시
        function highlightParcel(geometry) {
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = L.geoJSON(geometry, {
                interactive: false,
                style: {
                    color: '#d62828',
                    weight: 3,
                    fillColor: '#d62828',
                    fillOpacity: 0.08
                }
            }).addTo(map);
        }

        // 내 위치 버튼: 첫 화면에서 묻지 않고, 사용자가 원할 때만 위치 권한 요청
        const locateControl = L.control({ position: 'bottomright' });
        locateControl.onAdd = function() {
            const container = L.DomUtil.create('div', 'leaflet-bar');
            const button = L.DomUtil.create('a', 'locate-button', container);
            button.href = '#';
            button.title = '내 위치로 이동';
            button.setAttribute('role', 'button');
            button.setAttribute('aria-label', '내 위치로 이동');
            button.innerHTML = '<i class="fa-solid fa-location-arrow" aria-hidden="true"></i>';

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.preventDefault(e);
                findMyLocation(button);
            });
            return container;
        };
        locateControl.addTo(map);

        function findMyLocation(button) {
            if (!('geolocation' in navigator)) {
                alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
                return;
            }

            const icon = button.querySelector('i');
            const stopLoading = () => {
                button.classList.remove('is-loading');
                icon.className = 'fa-solid fa-location-arrow';
            };
            button.classList.add('is-loading');
            icon.className = 'fa-solid fa-spinner fa-spin';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    stopLoading();
                    const lat = position.coords.latitude;   // 위도
                    const lng = position.coords.longitude; // 경도

                    // 지도의 중심을 내 위치로 이동 (지적도가 보이는 줌 레벨 17)
                    map.setView([lat, lng], 17);
                    placeMarker([lat, lng])
                        .bindPopup('내 위치<br><span style="font-size: 12px; color: #666;">진단하려면 지도에서 필지를 눌러주세요.</span>')
                        .openPopup();
                },
                function(error) {
                    stopLoading();
                    console.warn('위치 정보를 가져올 수 없습니다:', error.message);
                    alert('위치 정보를 가져올 수 없습니다. 브라우저의 위치 권한을 확인해 주세요.');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 검색창 이벤트
        const addressInput = document.getElementById('address-input');
        addressInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('search-btn').click();
            }
        });

        // 주소·장소 검색 (VWorld 검색 API, 지번·도로명·장소 이름)
        const searchResults = document.getElementById('search-results');

        function showSearchMessage(message) {
            searchResults.innerHTML = `<li class="search-message">${escapeHtml(message)}</li>`;
            searchResults.hidden = false;
        }

        // 검색 결과로 이동해서 바로 필지 진단
        function goToResult(result) {
            searchResults.hidden = true;
            const latlng = L.latLng(result.lat, result.lng);
            map.setView(latlng, 18);
            diagnose(latlng);
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const keyword = addressInput.value.trim();

            if (keyword.length < 2) {
                showSearchMessage('주소나 장소 이름을 2글자 이상 입력해 주세요.');
                return;
            }

            showSearchMessage('검색 중...');

            fetch(`/api/search?query=${encodeURIComponent(keyword)}`)
                .then(response => {
                    if (!response.ok) throw new Error('주소 검색 실패');
                    return response.json();
                })
                .then(data => {
                    if (data.results.length === 0) {
                        showSearchMessage('찾는 주소가 없어요. 지번(예: 경주시 인왕동 815-1)이나 도로명(예: 세종대로 110)으로 검색해 보세요.');
                        return;
                    }
                    if (data.results.length === 1) {
                        goToResult(data.results[0]);
                        return;
                    }

                    searchResults.innerHTML = '';
                    data.results.forEach(result => {
                        const item = document.createElement('li');
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.innerHTML = `<b>${escapeHtml(result.label)}</b>${result.sub ? `<span>${escapeHtml(result.sub)}</span>` : ''}`;
                        button.addEventListener('click', () => goToResult(result));
                        item.appendChild(button);
                        searchResults.appendChild(item);
                    });
                    searchResults.hidden = false;
                })
                .catch(error => {
                    console.error('주소 검색 오류:', error);
                    showSearchMessage('주소 검색에 실패했어요. 잠시 후 다시 시도해 주세요.');
                });
        });

        // 팝업에 넣는 VWorld 텍스트의 HTML 특수문자 처리
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        map.on('click', function(e) {
            diagnose(e.latlng);
        });

        // 한 지점의 필지를 진단 (지도 클릭, 주소 검색에서 사용)
        function diagnose(clickedLatlng) {
            // 응답이 늦게 와도 이 클릭의 핀에만 결과를 넣도록 지역 변수로 보관
            const clickMarker = placeMarker(clickedLatlng);
            clickMarker.bindPopup('필지와 국가유산 데이터 확인 중...', { maxWidth: 320 }).openPopup();

            const query = `lat=${clickedLatlng.lat}&lng=${clickedLatlng.lng}`;

            // 필지 단위로 진단하고, 지적도에 없는 곳이면 클릭 지점만 진단
            fetch(`/api/parcel?${query}`)
                .then(response => {
                    if (!response.ok) throw new Error('필지 진단 실패');
                    return response.json();
                })
                .then(data => {
                    if (clickMarker !== activeMarker) return; // 그사이 다른 곳을 눌렀으면 무시
                    if (data.parcel) {
                        highlightParcel(data.parcel.geometry);
                        showParcelResult(clickMarker, data);
                        showGuidancePanel(data);
                        return;
                    }
                    resultPanel.hidden = true;
                    return fetch(`/api/heritage?${query}`)
                        .then(response => {
                            if (!response.ok) throw new Error('국가유산 구역 조회 실패');
                            return response.json();
                        })
                        .then(pointData => showResult(clickMarker, pointData));
                })
                .catch(error => {
                    console.error('진단 오류:', error);
                    clickMarker.setPopupContent('국가유산 데이터를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                });
        }

        function formatArea(value) {
            return `${value.toLocaleString('ko-KR')}㎡`;
        }

        // 같은 이름이 여러 번 등록된 유적은 가장 많이 겹친 것 하나만 표시
        function dedupeSites(sites) {
            const byName = new Map();
            sites.forEach(site => {
                const prev = byName.get(site.name);
                if (!prev || site.overlapArea > prev.overlapArea) byName.set(site.name, site);
            });
            return [...byName.values()];
        }

        function showParcelResult(marker, data) {
            const parcel = data.parcel;
            const items = [
                ...(data.zones || []).map(zone => ({ name: zone.name, type: zone.type, overlapArea: zone.overlapArea, overlapRatio: zone.overlapRatio, edgeOnly: zone.edgeOnly })),
                ...dedupeSites(data.sites || []).map(site => ({ name: site.name || '이름 없음', type: '문화유적 분포 범위', overlapArea: site.overlapArea, overlapRatio: site.overlapRatio, edgeOnly: site.edgeOnly }))
            ].sort((a, b) => b.overlapArea - a.overlapArea);

            const realItems = items.filter(item => !item.edgeOnly);
            const edgeItems = items.filter(item => item.edgeOnly);
            const failed = data.zones === null || data.sites === null;

            const parcelInfo = `
                <p style="margin: 0 0 6px 0; font-size: 13px;">
                    <b>${escapeHtml(parcel.address)}</b><br>
                    <span style="color: #666;">지목·지번 ${escapeHtml(parcel.jibun)} · 필지 면적 ${formatArea(parcel.area)}</span>
                </p>`;

            // 이름이 없는 구역(역사문화환경 보존지역 등)은 종류만 표시
            const itemLabel = item => item.name
                ? `${escapeHtml(item.name)} <span style="color: #666;">(${escapeHtml(item.type)})</span>`
                : escapeHtml(item.type);
            const listItem = item => `<li>${itemLabel(item)} · ${formatArea(item.overlapArea)} (${item.overlapRatio}%)</li>`;
            // 팝업이 지도를 너무 가리지 않게 많이 겹친 3개만 보여주고 나머지는 건수로 표시
            const POPUP_ITEM_LIMIT = 3;
            const hiddenCount = realItems.length - POPUP_ITEM_LIMIT;
            const realList = realItems.length > 0
                ? `<ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${realItems.slice(0, POPUP_ITEM_LIMIT).map(listItem).join('')}${hiddenCount > 0 ? `<li style="list-style: none; color: #666;">외 ${hiddenCount}건</li>` : ''}</ul>`
                : '';
            const edgeList = edgeItems.length > 0
                ? `<p style="margin: 6px 0 0 0; font-size: 12px; color: #666;">경계에만 걸침 (도면 오차일 수 있음): ${edgeItems.map(item => escapeHtml(item.name || item.type)).join(', ')}</p>`
                : '';
            const failNote = failed
                ? '<p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">※ 일부 데이터를 불러오지 못해 결과가 불완전할 수 있습니다.</p>'
                : '';
            const nearest = (data.nearbySites || [])[0];
            const nearestLine = nearest
                ? `<p style="margin: 6px 0 0 0; font-size: 12px; color: #666;">가장 가까운 문화유적: ${escapeHtml(nearest.name)} · 약 ${nearest.distance}m</p>`
                : '';
            const surveyCount = (data.surveys || []).length;
            const surveyLine = surveyCount > 0
                ? `<p style="margin: 2px 0 0 0; font-size: 12px; color: #666;">주변 500m 조사 이력 ${surveyCount}건${surveyCount >= 10 ? ' 이상' : ''}</p>`
                : '';

            let title;
            let summary;
            if (realItems.length > 0) {
                title = '<h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 관련 영역 해당</h4>';
                summary = `<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 필지의 <b>${data.overlap.ratio}% (${formatArea(data.overlap.area)})</b>가 관련 영역에 걸칩니다.</p>`;
            } else if (edgeItems.length > 0) {
                title = '<h4 style="margin: 0 0 5px 0; color: #e9a400;">경계 확인 필요</h4>';
                summary = '<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟡 관련 영역이 필지 경계에만 살짝 걸칩니다.</p>';
            } else if (failed) {
                title = '<h4 style="margin: 0 0 5px 0; color: #666;">확인된 영역 없음</h4>';
                summary = '<p style="margin: 0; font-size: 13px;">관련 영역이 없지만, 일부 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</p>';
            } else {
                title = '<h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 관련 영역 외 지역</h4>';
                summary = '<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 필지가 관련 영역에 포함되지 않습니다.</p>';
            }

            marker.setPopupContent(`
                <div style="padding: 5px;">
                    ${title}
                    ${parcelInfo}
                    ${summary}
                    ${realList}
                    ${edgeList}
                    ${nearestLine}
                    ${surveyLine}
                    ${failNote}
                    <button type="button" class="go-panel" onclick="scrollToPanel()">해야 할 일 보기 ▼</button>
                </div>
            `);
        }

        // 팝업의 "해야 할 일 보기" 버튼: 결과 패널로 부드럽게 이동
        function scrollToPanel() {
            resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 진단 결과 패널 (guidance.js의 규칙으로 해야 할 일과 비용 안내 생성)
        const resultPanel = document.getElementById('result-panel');
        let lastParcelResult = null;

        const WORK_TYPES = [
            ['', '선택 안 함'],
            ['house', '단독주택'],
            ['farm', '농업인·어업인 시설물'],
            ['business', '개인사업자 시설물'],
            ['factory', '공장'],
            ['other', '그 밖의 공사']
        ];

        function readNumber(id) {
            const input = document.getElementById(id);
            if (!input || input.value.trim() === '') return null;
            const value = Number(input.value);
            return Number.isFinite(value) && value >= 0 ? value : null;
        }

        function showGuidancePanel(data) {
            lastParcelResult = data;
            const workOptions = WORK_TYPES
                .map(([value, label]) => `<option value="${value}">${label}</option>`)
                .join('');

            resultPanel.innerHTML = `
                <h3>진단 결과 · 해야 할 일</h3>
                <p class="panel-sub">${escapeHtml(data.parcel.address)} · 필지 면적 ${formatArea(data.parcel.area)}</p>
                <div class="inputs">
                    <label>공사 종류 <select id="work-type">${workOptions}</select></label>
                    <label>사업(대지) 면적 <input id="land-area" type="number" min="0" step="1" value="${Math.round(data.parcel.area)}"> ㎡</label>
                    <label id="floor-area-field" hidden>건축물 연면적 <input id="floor-area" type="number" min="0" step="1"> ㎡</label>
                </div>
                <div id="guidance-body"></div>
            `;
            resultPanel.hidden = false;

            resultPanel.querySelectorAll('select, input').forEach(element => {
                element.addEventListener('input', renderGuidance);
            });
            renderGuidance();
        }

        function lawDetails(law) {
            return law
                ? `<details class="law"><summary>법령 근거</summary>${escapeHtml(law)}</details>`
                : '';
        }

        function renderGuidance() {
            if (!lastParcelResult) return;

            const workType = document.getElementById('work-type').value;
            document.getElementById('floor-area-field').hidden = workType !== 'business';

            const guidance = window.buildGuidance(lastParcelResult, {
                workType,
                landArea: readNumber('land-area'),
                floorArea: workType === 'business' ? readNumber('floor-area') : null
            });

            const steps = guidance.steps.map(step => `
                <div class="step ${step.level}">
                    <div class="step-title">${escapeHtml(step.title)}</div>
                    <div>${escapeHtml(step.body)}</div>
                    ${lawDetails(step.law)}
                </div>`).join('');

            const cost = guidance.cost ? `
                <h4>비용</h4>
                <div class="step info">
                    <div>${escapeHtml(guidance.cost.summary)}</div>
                    ${lawDetails(guidance.cost.law)}
                </div>
                <div class="step ${guidance.cost.support.level}">
                    <div>${escapeHtml(guidance.cost.support.text)}</div>
                    ${lawDetails(guidance.cost.support.law)}
                </div>` : '';

            const nearbySites = lastParcelResult.nearbySites;
            const nearby = nearbySites === null || nearbySites === undefined
                ? ''
                : `
                <h4>주변 문화유적 (500m 이내)</h4>
                ${nearbySites.length > 0
                    ? `<ul class="notes">${nearbySites.map(site => `<li>${escapeHtml(site.name)} · 약 ${site.distance}m${site.mapNo ? ` <span style="color: #666; font-size: 12px;">(분포지도 ${escapeHtml(site.mapNo)})</span>` : ''}</li>`).join('')}</ul>`
                    : '<p class="panel-sub">500m 안에 문화유적 분포 범위가 없어요.</p>'}
                <p class="disclaimer" style="margin-top: 4px;">필지 경계에서 각 유적 분포 범위 경계까지의 가장 짧은 거리예요. 이미 필지와 겹치는 유적은 빼고 가까운 5곳만 보여줘요.</p>`;

            const surveys = lastParcelResult.surveys;
            const surveyItem = survey => `
                <li>
                    <span class="survey-method">${escapeHtml(survey.method)}</span>
                    ${escapeHtml(survey.name || '이름 없음')} ·
                    ${survey.distance === 0 ? '<b>필지에 걸침</b>' : `약 ${survey.distance}m`}${survey.year ? ` · ${survey.year}년` : ''}
                    ${survey.report ? `<div class="survey-report">${escapeHtml(survey.report)}</div>` : ''}
                </li>`;
            const surveySection = surveys === null || surveys === undefined
                ? ''
                : `
                <h4>주변 조사 이력 (500m 이내)</h4>
                ${surveys.length > 0
                    ? `<ul class="notes surveys">${surveys.map(surveyItem).join('')}</ul>`
                    : '<p class="panel-sub">500m 안에 등록된 조사 기록이 없어요.</p>'}
                <p class="disclaimer" style="margin-top: 4px;">국가유산청 국가유산조사구역 자료예요. 가까운 순으로 최대 10건을 보여주고, 조사 종류와 연도는 보고서 이름에서 읽어낸 거라 실제와 다를 수 있어요.</p>`;

            const notes = guidance.notes.map(note => `
                <li>${escapeHtml(note.text)} ${lawDetails(note.law)}</li>`).join('');

            const incomplete = guidance.incomplete
                ? '<p class="disclaimer">※ 일부 데이터를 불러오지 못해 안내가 불완전할 수 있어요.</p>'
                : '';

            document.getElementById('guidance-body').innerHTML = `
                <h4>해야 할 일</h4>
                ${steps}
                ${cost}
                ${nearby}
                ${surveySection}
                <h4>알아두세요</h4>
                <ul class="notes">${notes}</ul>
                ${incomplete}
                <p class="disclaimer">이 안내는 공공데이터와 법령을 바탕으로 한 <b>참고용 정보</b>이며 법적 판단을 대신하지 않아요. 정확한 내용은 관할 시·군·구 문화유산 담당 부서나 국가유산청에 문의하세요.</p>
            `;
        }

        function showResult(marker, data) {
            const zones = data.zones || [];
            // 같은 이름의 유적이 여러 번 등록된 경우 한 번만 표시
            const sites = (data.sites || []).filter((site, index, list) =>
                list.findIndex(other => other.name === site.name) === index
            );
            const failed = data.zones === null || data.sites === null;
            const failNote = failed
                ? '<p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">※ 일부 데이터를 불러오지 못해 결과가 불완전할 수 있습니다.</p>'
                : '';

            if (zones.length > 0 || sites.length > 0) {
                const zoneItems = zones
                    .map(zone => `<li>${escapeHtml(zone.name || '이름 없음')} <span style="color: #666;">(${escapeHtml(zone.type)})</span></li>`)
                    .join('');
                const siteItems = sites
                    .map(site => `<li>${escapeHtml(site.name || '이름 없음')} <span style="color: #666;">(문화유적 분포 범위)</span></li>`)
                    .join('');
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 관련 영역 해당</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 관련 영역에 포함됩니다.</p>
                        <ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${zoneItems}${siteItems}</ul>
                        ${failNote}
                    </div>
                `);
            } else if (failed) {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #666;">확인된 영역 없음</h4>
                        <p style="margin: 0; font-size: 13px;">조회된 범위에서는 관련 영역이 없지만, 일부 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</p>
                    </div>
                `);
            } else {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 관련 영역 외 지역</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 관련 영역에 포함되지 않습니다.</p>
                    </div>
                `);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>땅파기전</title>
    
    <!-- 1. Leaflet CSS 스타일 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* 지도를 담을 div는 반드시 높이(height)가 있어야 함! */
        #map { 
            width: 100%; 
            height: 480px; 
        }
    </style>
</head>
<body>    
    <!-- 2. 지도가 들어갈 공간 -->
    <div id="map"></div>

    <!-- 주소 검색 UI 패널 -->
    <div id="search-box" style="margin-bottom: 10px; z-index: 1000; position: relative;">
        <input
            type="text"
            id="address-input"
            placeholder="예:서울시청 또는 서울시 종로구"
            style="width: 300px; padding: 8px; font-size: 14px;"
        >
        <button
            id="search-btn"
            style="padding: 8px 15px; font-size: 14px; cursor: pointer;"
        >
            검색
        </button>
    </div>

    <!-- 3. Leaflet 자바스크립트 불러오기 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 지도 초기화 (서울 시청 위경도 좌표 [37.5665, 126.9780], 줌 레벨 13)
        const map = L.map('map').setView([37.5665, 126.9780], 13);

        // 오픈스트리트맵(무료 배경 지도) 입히기
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // VWorld 지적도 WMS 레이어 생성
        const cadastralLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',

                // BUBBLE이 아니라 BUBUN
                layers: 'lp_pa_cbnd_bubun,lp_pa_cbnd_bonbun',

                // 잘못된 스타일명을 보내지 않고 기본 스타일 사용
                styles: '',

                format: 'image/png',
                transparent: true,
                crs: L.CRS.EPSG3857,

                // VWorld는 줌 17 미만에서 빈 이미지를 보내므로 17부터 요청
                minZoom: 17,
                maxZoom: 19
            }
        ).addTo(map);

        // VWorld 국가유산 지정/보호구역 WMS 레이어 생성 (줌 10부터 표시됨)
        const heritageLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',
                layers: 'lt_c_uo301',
                styles: 'lt_c_uo301',
                format: 'image/png',
                transparent: true,
                opacity: 0.6,
                crs: L.CRS.EPSG3857,
                minZoom: 10,
                maxZoom: 19
            }
        ).addTo(map);

        // 지도 컨트롤 버튼 생성
        const overlayMaps = {
            "지적도 표시": cadastralLayer,
            "국가유산 구역 표시": heritageLayer
        };
        L.control.layers(null, overlayMaps).addTo(map);

        // 지적도가 켜져 있는데 줌이 부족하면 안내 문구 표시
        const CADASTRAL_MIN_ZOOM = 17;
        const zoomHint = L.control({ position: 'bottomleft' });
        zoomHint.onAdd = function() {
            const div = L.DomUtil.create('div');
            div.style.cssText = 'background: white; padding: 6px 10px; font-size: 13px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);';
            div.textContent = '지적도는 더 확대하면 표시됩니다.';
            return div;
        };

        function updateZoomHint() {
            const needsZoom = map.hasLayer(cadastralLayer) && map.getZoom() < CADASTRAL_MIN_ZOOM;
            if (needsZoom) {
                zoomHint.addTo(map);
            } else {
                zoomHint.remove();
            }
        }

        map.on('zoomend overlayadd overlayremove', updateZoomHint);
        updateZoomHint();

        // 브라우저의 Geolocation 기능 지원 확인
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;   // 위도
                    const lng = position.coords.longitude; // 경도

                    console.log("내 위치:", lat, lng);

                    // 지도의 중심을 내 위치로 이동 (지적도가 보이는 줌 레벨 17)
                    map.setView([lat, lng], 17);

                    // 내 위치에 마커 꽂기
                    const marker = L.marker([lat, lng]).addTo(map);
                    marker.bindPopup('내 위치').openPopup();
                },
                function(error) {
                    console.warn("위치 정보를 가져올 수 없습니다: ", error.message);
                    alert("위치 정보 권한이 거부되었거나 지원되지 않습니다. 서울시청 기준으로 표시됩니다.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        } else {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
        }

        // 검색창 이벤트
        const addressInput = document.getElementById('address-input');
        addressInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('search-btn').click();
            }
        });

        document.getElementById('search-btn').addEventListener('click', function() {
            const keyword = document.getElementById('address-input').value;
            
            if (!keyword) {
                alert("검색할 주소를 입력해주세요!");
                return;
            }

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        console.log("검색된 좌표:", lat, lon);

                        map.setView([lat, lon], 17);

                        const searchMarker = L.marker([lat, lon]).addTo(map);
                        searchMarker.bindPopup(`<b>검색 결과:</b><br>${data[0].display_name}`).openPopup();
                    } else {
                        alert("해당 주소를 찾을 수 없습니다. 다른 검색어로 시도해 보세요!");
                    }
                })
                .catch(error => {
                    console.error("주소 검색 중 에러 발생:", error);
                    alert("주소 검색에 실패했습니다.");
                });
        });

        // 팝업에 넣는 VWorld 텍스트의 HTML 특수문자 처리
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let clickMarker = null;

        map.on('click', function(e) {
            if (clickMarker) map.removeLayer(clickMarker);

            const clickedLatlng = e.latlng;
            clickMarker = L.marker(clickedLatlng).addTo(map);
            clickMarker.bindPopup('국가유산 구역 확인 중...').openPopup();

            const url = `/api/heritage?lat=${clickedLatlng.lat}&lng=${clickedLatlng.lng}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('국가유산 구역 조회 실패');
                    }
                    return response.json();
                })
                .then(data => showResult(clickMarker, data.zones))
                .catch(error => {
                    console.error('국가유산 구역 조회 오류:', error);
                    clickMarker.setPopupContent('국가유산 구역을 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                });
        });

        function showResult(marker, zones) {
            if (zones.length > 0) {
                const items = zones
                    .map(zone => `<li>${escapeHtml(zone.name || '이름 없음')} <span style="color: #666;">(${escapeHtml(zone.type)})</span></li>`)
                    .join('');
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 구역 해당</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 관련 영역에 포함됩니다.</p>
                        <ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${items}</ul>
                    </div>
                `);
            } else {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 구역 외 지역</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 관련 영역에 포함되지 않습니다.</p>
                    </div>
                `);
            }
        }
    </script>
</body>
</html>

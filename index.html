                if (depth !== null) url.searchParams.set('depth', depth);
            }
            return url.toString();
        }

        // 주소창을 지금 결과의 링크로 바꿈 (뒤로 가기 기록은 남기지 않음)
        function updateShareUrl() {
            const url = buildShareUrl();
            if (url !== window.location.href) history.replaceState(null, '', url);
        }

        function setShareStatus(message) {
            const status = document.getElementById('share-status');
            if (status) status.textContent = message;
        }

        async function copyShareLink() {
            const url = buildShareUrl();

            // 휴대폰은 공유 창(카카오톡, 문자 등)을 바로 띄움
            if (navigator.share && window.matchMedia('(pointer: coarse)').matches) {
                try {
                    await navigator.share({ title: '땅파기전 진단 결과', url });
                    return;
                } catch (error) {
                    if (error.name === 'AbortError') return;
                }
            }

            try {
                await navigator.clipboard.writeText(url);
                setShareStatus('링크를 복사했어요. 열면 그때의 데이터로 다시 진단해요.');
            } catch {
                // 복사가 막힌 브라우저: 링크를 보여주고 직접 복사하게 함
                const fallback = document.getElementById('share-fallback');
                fallback.innerHTML = `<input class="share-link-input" type="text" readonly value="${escapeHtml(url)}" aria-label="공유 링크">`;
                fallback.querySelector('input').select();
                setShareStatus('자동 복사가 안 돼요. 아래 링크를 복사해 주세요.');
            }
        }

        function printResult() {
            window.print();
        }

        // 인쇄 직전: 머리글을 채우고 펼쳐보기를 모두 펼침, 인쇄 뒤에 원래대로
        let detailsBeforePrint = [];
        window.addEventListener('beforeprint', () => {
            const header = document.getElementById('print-header');
            if (!header || resultPanel.hidden) return;

            const time = (diagnosedAt || new Date()).toLocaleString('ko-KR');
            header.innerHTML = `
                <div class="print-title">땅파기전 · 문화유산 사전 확인 결과</div>
                <div>진단 일시: ${escapeHtml(time)}</div>
                ${shareLocation ? `<div class="print-link">다시 보기: ${escapeHtml(buildShareUrl())}</div>` : ''}
                <div>공공데이터는 바뀔 수 있어서, 같은 위치도 나중에 다시 진단하면 결과가 달라질 수 있어요.</div>`;

            detailsBeforePrint = [...resultPanel.querySelectorAll('details')].map(element => [element, element.open]);
            detailsBeforePrint.forEach(([element]) => { element.open = true; });
        });
        window.addEventListener('afterprint', () => {
            detailsBeforePrint.forEach(([element, open]) => { element.open = open; });
            detailsBeforePrint = [];
        });

        // 공유 링크로 열었으면 그 위치를 바로 진단
        (function openSharedLink() {
            const params = new URLSearchParams(window.location.search);
            const lat = Number(params.get('lat'));
            const lng = Number(params.get('lng'));
            if (!params.has('lat') || !params.has('lng') || !Number.isFinite(lat) || !Number.isFinite(lng) ||
                lat < 33 || lat > 39 || lng < 124 || lng > 132) return;

            const number = name => {
                const value = Number(params.get(name));
                return params.has(name) && Number.isFinite(value) && value >= 0 ? value : null;
            };
            const work = params.get('work') || '';
            const ground = Number(params.get('ground'));
            sharedInputs = {
                work: WORK_TYPES.some(([value]) => value === work) ? work : '',
                area: number('area'),
                floor: number('floor'),
                ground: params.has('ground') && Number.isFinite(ground) && ground >= -20 && ground <= 2000 ? ground : null,
                depth: number('depth')
            };

            const latlng = L.latLng(lat, lng);
            map.setView(latlng, 18);
            diagnose(latlng);
        })();
    </script>
</body>
</html>

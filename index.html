<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>땅파기전</title>
    
    <!-- 1. Leaflet CSS 스타일 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* 지도를 담을 div는 반드시 높이(height)가 있어야 함! */
        #map { 
            width: 100%; 
            height: 480px;
        }

        /* 지도 범례 */
        .map-legend {
            background: white;
            padding: 6px 10px;
            font-size: 12px;
            line-height: 20px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .map-legend .legend-title {
            font-weight: bold;
            margin-bottom: 2px;
        }
        .map-legend .swatch {
            display: inline-block;
            width: 14px;
            height: 12px;
            margin-right: 6px;
            vertical-align: middle;
            box-sizing: border-box;
        }
    </style>
</head>
<body>    
    <!-- 2. 지도가 들어갈 공간 -->
    <div id="map"></div>

    <!-- 주소 검색 UI 패널 -->
    <div id="search-box" style="margin-bottom: 10px; z-index: 1000; position: relative;">
        <input
            type="text"
            id="address-input"
            placeholder="예:서울시청 또는 서울시 종로구"
            style="width: 300px; padding: 8px; font-size: 14px;"
        >
        <button
            id="search-btn"
            style="padding: 8px 15px; font-size: 14px; cursor: pointer;"
        >
            검색
        </button>
    </div>

    <!-- 데이터 출처 표시 -->
    <p id="data-source" style="margin: 0 0 10px 0; font-size: 12px; color: #666;">
        출처: 국가유산청 국가유산 공간정보서비스(문화유적분포지도), 국토교통부 브이월드(국가유산 지정/보호구역, 지적도), OpenStreetMap
    </p>

    <!-- 3. Leaflet 자바스크립트 불러오기 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 지도 초기화 (서울 시청 위경도 좌표 [37.5665, 126.9780], 줌 레벨 13)
        const map = L.map('map').setView([37.5665, 126.9780], 13);

        // 오픈스트리트맵(무료 배경 지도) 입히기
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // VWorld 지적도 WMS 레이어 생성
        const cadastralLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',

                // BUBBLE이 아니라 BUBUN
                layers: 'lp_pa_cbnd_bubun,lp_pa_cbnd_bonbun',

                // 잘못된 스타일명을 보내지 않고 기본 스타일 사용
                styles: '',

                format: 'image/png',
                transparent: true,
                crs: L.CRS.EPSG3857,

                // VWorld는 줌 17 미만에서 빈 이미지를 보내므로 17부터 요청
                minZoom: 17,
                maxZoom: 19
            }
        ).addTo(map);

        // VWorld 국가유산 지정/보호구역 WMS 레이어 생성 (줌 10부터 표시됨)
        const heritageLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',
                layers: 'lt_c_uo301',
                styles: 'lt_c_uo301',
                format: 'image/png',
                transparent: true,
                opacity: 0.6,
                crs: L.CRS.EPSG3857,
                minZoom: 10,
                maxZoom: 19
            }
        ).addTo(map);

        // 국가유산청 문화유적분포지도 (줌 15부터 1.2km 칸 단위로 도형을 받아 그림)
        const SITES_MIN_ZOOM = 15;
        const sitesLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                // VWorld 보호구역(파란 빗금)과 구분되도록 보라색 사용
                color: '#7b2cbf',
                weight: 1.5,
                fillColor: '#9d4edd',
                fillOpacity: 0.25
            }
        }).addTo(map);
        const loadedSiteTiles = new Set();
        const loadedSiteIds = new Set();

        function loadSites() {
            if (!map.hasLayer(sitesLayer) || map.getZoom() < SITES_MIN_ZOOM) return;

            const bounds = map.getBounds();
            const min = map.project(bounds.getNorthWest(), SITES_MIN_ZOOM).divideBy(256).floor();
            const max = map.project(bounds.getSouthEast(), SITES_MIN_ZOOM).divideBy(256).floor();

            for (let x = min.x; x <= max.x; x++) {
                for (let y = min.y; y <= max.y; y++) {
                    const tileKey = `${x}/${y}`;
                    if (loadedSiteTiles.has(tileKey)) continue;
                    loadedSiteTiles.add(tileKey);

                    fetch(`/api/heritage-sites?x=${x}&y=${y}`)
                        .then(response => {
                            if (!response.ok) throw new Error('문화유적분포지도 조회 실패');
                            return response.json();
                        })
                        .then(data => {
                            // 여러 칸에 걸친 유적은 한 번만 그림
                            const newFeatures = data.features.filter(feature => !loadedSiteIds.has(feature.properties.id));
                            newFeatures.forEach(feature => loadedSiteIds.add(feature.properties.id));
                            sitesLayer.addData(newFeatures);
                        })
                        .catch(error => {
                            console.error('문화유적분포지도 불러오기 오류:', error);
                            loadedSiteTiles.delete(tileKey); // 다음 이동 때 다시 시도
                        });
                }
            }
        }

        map.on('moveend overlayadd', loadSites);
        loadSites();

        // 지도 컨트롤 버튼 생성
        const overlayMaps = {
            "지적도 표시": cadastralLayer,
            "국가유산 구역 표시": heritageLayer,
            "문화유적 분포 범위 표시": sitesLayer
        };
        L.control.layers(null, overlayMaps).addTo(map);

        // 범례: 지도 색깔이 무엇을 뜻하는지 표시 (VWorld 색은 GetLegendGraphic 기준)
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'map-legend');
            div.innerHTML = `
                <div class="legend-title">범례</div>
                <div><span class="swatch" style="background: #ffff4d; border: 1px solid #c9c900;"></span>국가·시도 지정유산 구역</div>
                <div><span class="swatch" style="background: repeating-linear-gradient(135deg, #4bb3e8 0 2px, #fff 2px 4px);"></span>보호구역</div>
                <div><span class="swatch" style="border: 2px solid #4caf50;"></span>역사문화환경 보존지역</div>
                <div><span class="swatch" style="background: rgba(157, 78, 221, 0.25); border: 1.5px solid #7b2cbf;"></span>문화유적 분포 범위</div>
                <div><span class="swatch" style="border: 1.5px solid #e8a33d;"></span>지적도(필지 경계)</div>
            `;
            return div;
        };
        legend.addTo(map);

        // 켜져 있는 레이어가 현재 줌에서 안 보이면 안내 문구 표시
        const CADASTRAL_MIN_ZOOM = 17;
        const zoomHint = L.control({ position: 'bottomleft' });
        zoomHint.onAdd = function() {
            const div = L.DomUtil.create('div');
            div.style.cssText = 'background: white; padding: 6px 10px; font-size: 13px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);';
            return div;
        };

        function updateZoomHint() {
            const hidden = [];
            if (map.hasLayer(sitesLayer) && map.getZoom() < SITES_MIN_ZOOM) hidden.push('문화유적 분포 범위');
            if (map.hasLayer(cadastralLayer) && map.getZoom() < CADASTRAL_MIN_ZOOM) hidden.push('지적도');

            if (hidden.length > 0) {
                zoomHint.addTo(map);
                zoomHint.getContainer().textContent = `${hidden.join(', ')}는 더 확대하면 표시됩니다.`;
            } else {
                zoomHint.remove();
            }
        }

        map.on('zoomend overlayadd overlayremove', updateZoomHint);
        updateZoomHint();

        // 지도 위 핀은 하나만 유지 (내 위치, 검색, 클릭 중 마지막 것만 표시)
        let activeMarker = null;
        let parcelHighlight = null;

        function placeMarker(latlng) {
            if (activeMarker) map.removeLayer(activeMarker);
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = null;
            activeMarker = L.marker(latlng).addTo(map);
            return activeMarker;
        }

        // 진단한 필지를 지도에 강조 표시
        function highlightParcel(geometry) {
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = L.geoJSON(geometry, {
                interactive: false,
                style: {
                    color: '#d62828',
                    weight: 3,
                    fillColor: '#d62828',
                    fillOpacity: 0.08
                }
            }).addTo(map);
        }

        // 브라우저의 Geolocation 기능 지원 확인
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;   // 위도
                    const lng = position.coords.longitude; // 경도

                    console.log("내 위치:", lat, lng);

                    // 지도의 중심을 내 위치로 이동 (지적도가 보이는 줌 레벨 17)
                    map.setView([lat, lng], 17);

                    // 내 위치에 마커 꽂기
                    placeMarker([lat, lng]).bindPopup('내 위치').openPopup();
                },
                function(error) {
                    console.warn("위치 정보를 가져올 수 없습니다: ", error.message);
                    alert("위치 정보 권한이 거부되었거나 지원되지 않습니다. 서울시청 기준으로 표시됩니다.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        } else {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
        }

        // 검색창 이벤트
        const addressInput = document.getElementById('address-input');
        addressInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('search-btn').click();
            }
        });

        document.getElementById('search-btn').addEventListener('click', function() {
            const keyword = document.getElementById('address-input').value;
            
            if (!keyword) {
                alert("검색할 주소를 입력해주세요!");
                return;
            }

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        console.log("검색된 좌표:", lat, lon);

                        map.setView([lat, lon], 17);

                        placeMarker([lat, lon])
                            .bindPopup(`<b>검색 결과:</b><br>${escapeHtml(data[0].display_name)}`)
                            .openPopup();
                    } else {
                        alert("해당 주소를 찾을 수 없습니다. 다른 검색어로 시도해 보세요!");
                    }
                })
                .catch(error => {
                    console.error("주소 검색 중 에러 발생:", error);
                    alert("주소 검색에 실패했습니다.");
                });
        });

        // 팝업에 넣는 VWorld 텍스트의 HTML 특수문자 처리
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        map.on('click', function(e) {
            const clickedLatlng = e.latlng;
            // 응답이 늦게 와도 이 클릭의 핀에만 결과를 넣도록 지역 변수로 보관
            const clickMarker = placeMarker(clickedLatlng);
            clickMarker.bindPopup('필지와 국가유산 데이터 확인 중...', { maxWidth: 320 }).openPopup();

            const query = `lat=${clickedLatlng.lat}&lng=${clickedLatlng.lng}`;

            // 필지 단위로 진단하고, 지적도에 없는 곳이면 클릭 지점만 진단
            fetch(`/api/parcel?${query}`)
                .then(response => {
                    if (!response.ok) throw new Error('필지 진단 실패');
                    return response.json();
                })
                .then(data => {
                    if (clickMarker !== activeMarker) return; // 그사이 다른 곳을 눌렀으면 무시
                    if (data.parcel) {
                        highlightParcel(data.parcel.geometry);
                        showParcelResult(clickMarker, data);
                        return;
                    }
                    return fetch(`/api/heritage?${query}`)
                        .then(response => {
                            if (!response.ok) throw new Error('국가유산 구역 조회 실패');
                            return response.json();
                        })
                        .then(pointData => showResult(clickMarker, pointData));
                })
                .catch(error => {
                    console.error('진단 오류:', error);
                    clickMarker.setPopupContent('국가유산 데이터를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                });
        });

        function formatArea(value) {
            return `${value.toLocaleString('ko-KR')}㎡`;
        }

        // 같은 이름이 여러 번 등록된 유적은 가장 많이 겹친 것 하나만 표시
        function dedupeSites(sites) {
            const byName = new Map();
            sites.forEach(site => {
                const prev = byName.get(site.name);
                if (!prev || site.overlapArea > prev.overlapArea) byName.set(site.name, site);
            });
            return [...byName.values()];
        }

        function showParcelResult(marker, data) {
            const parcel = data.parcel;
            const items = [
                ...(data.zones || []).map(zone => ({ name: zone.name || '이름 없음', type: zone.type, overlapArea: zone.overlapArea, overlapRatio: zone.overlapRatio, edgeOnly: zone.edgeOnly })),
                ...dedupeSites(data.sites || []).map(site => ({ name: site.name || '이름 없음', type: '문화유적 분포 범위', overlapArea: site.overlapArea, overlapRatio: site.overlapRatio, edgeOnly: site.edgeOnly }))
            ].sort((a, b) => b.overlapArea - a.overlapArea);

            const realItems = items.filter(item => !item.edgeOnly);
            const edgeItems = items.filter(item => item.edgeOnly);
            const failed = data.zones === null || data.sites === null;

            const parcelInfo = `
                <p style="margin: 0 0 6px 0; font-size: 13px;">
                    <b>${escapeHtml(parcel.address)}</b><br>
                    <span style="color: #666;">지목·지번 ${escapeHtml(parcel.jibun)} · 필지 면적 ${formatArea(parcel.area)}</span>
                </p>`;

            const listItem = item => `<li>${escapeHtml(item.name)} <span style="color: #666;">(${escapeHtml(item.type)})</span> · ${formatArea(item.overlapArea)} (${item.overlapRatio}%)</li>`;
            const realList = realItems.length > 0
                ? `<ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${realItems.map(listItem).join('')}</ul>`
                : '';
            const edgeList = edgeItems.length > 0
                ? `<p style="margin: 6px 0 0 0; font-size: 12px; color: #666;">경계에만 걸침 (도면 오차일 수 있음): ${edgeItems.map(item => escapeHtml(item.name)).join(', ')}</p>`
                : '';
            const failNote = failed
                ? '<p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">※ 일부 데이터를 불러오지 못해 결과가 불완전할 수 있습니다.</p>'
                : '';

            let title;
            let summary;
            if (realItems.length > 0) {
                title = '<h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 관련 영역 해당</h4>';
                summary = `<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 필지의 <b>${data.overlap.ratio}% (${formatArea(data.overlap.area)})</b>가 관련 영역에 걸칩니다.</p>`;
            } else if (edgeItems.length > 0) {
                title = '<h4 style="margin: 0 0 5px 0; color: #e9a400;">경계 확인 필요</h4>';
                summary = '<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟡 관련 영역이 필지 경계에만 살짝 걸칩니다.</p>';
            } else if (failed) {
                title = '<h4 style="margin: 0 0 5px 0; color: #666;">확인된 영역 없음</h4>';
                summary = '<p style="margin: 0; font-size: 13px;">관련 영역이 없지만, 일부 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</p>';
            } else {
                title = '<h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 관련 영역 외 지역</h4>';
                summary = '<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 필지가 관련 영역에 포함되지 않습니다.</p>';
            }

            marker.setPopupContent(`
                <div style="padding: 5px;">
                    ${title}
                    ${parcelInfo}
                    ${summary}
                    ${realList}
                    ${edgeList}
                    ${failNote}
                </div>
            `);
        }

        function showResult(marker, data) {
            const zones = data.zones || [];
            // 같은 이름의 유적이 여러 번 등록된 경우 한 번만 표시
            const sites = (data.sites || []).filter((site, index, list) =>
                list.findIndex(other => other.name === site.name) === index
            );
            const failed = data.zones === null || data.sites === null;
            const failNote = failed
                ? '<p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">※ 일부 데이터를 불러오지 못해 결과가 불완전할 수 있습니다.</p>'
                : '';

            if (zones.length > 0 || sites.length > 0) {
                const zoneItems = zones
                    .map(zone => `<li>${escapeHtml(zone.name || '이름 없음')} <span style="color: #666;">(${escapeHtml(zone.type)})</span></li>`)
                    .join('');
                const siteItems = sites
                    .map(site => `<li>${escapeHtml(site.name || '이름 없음')} <span style="color: #666;">(문화유적 분포 범위)</span></li>`)
                    .join('');
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 관련 영역 해당</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 관련 영역에 포함됩니다.</p>
                        <ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${zoneItems}${siteItems}</ul>
                        ${failNote}
                    </div>
                `);
            } else if (failed) {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #666;">확인된 영역 없음</h4>
                        <p style="margin: 0; font-size: 13px;">조회된 범위에서는 관련 영역이 없지만, 일부 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</p>
                    </div>
                `);
            } else {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 관련 영역 외 지역</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 관련 영역에 포함되지 않습니다.</p>
                    </div>
                `);
            }
        }
    </script>
</body>
</html>

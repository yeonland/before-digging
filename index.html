<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>땅파기전</title>
    
    <!-- 1. Leaflet CSS 스타일 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- 아이콘 (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        body {
            margin: 8px;
            font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
        }

        /* 지도를 담을 div는 반드시 높이(height)가 있어야 함! */
        #map {
            width: 100%;
            height: 480px;
        }

        /* 검색창: 화면이 좁으면 칸이 줄어듦 */
        #search-box .search-row {
            display: flex;
            gap: 6px;
            max-width: 420px;
        }
        #address-input {
            flex: 1;
            min-width: 0;
            padding: 8px;
            font-size: 14px;
        }
        #search-btn {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 도면(DXF) 올리기 버튼과 파일 칸 */
        #dxf-btn {
            padding: 8px 10px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        #dxf-input {
            display: none;
        }

        /* 도면 사업부지: 설정 단계 선택 목록과 필지별 표 */
        .site-options {
            list-style: none;
            margin: 4px 0 8px 0;
            padding: 0;
        }
        .site-options li {
            margin-bottom: 4px;
        }
        .site-options label {
            cursor: pointer;
        }
        .site-options .site-option-note {
            color: #666;
            font-size: 12px;
        }
        .site-run {
            margin: 8px 0;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .site-table-wrap {
            overflow-x: auto;
            margin: 6px 0 10px 0;
        }
        .site-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }
        .site-table th,
        .site-table td {
            border: 1px solid #ddd;
            padding: 4px 6px;
            text-align: left;
            vertical-align: top;
        }
        .site-table th {
            background: #f4f6f8;
            white-space: nowrap;
        }
        .site-table td.num {
            text-align: right;
            white-space: nowrap;
        }
        .site-table tbody tr {
            cursor: pointer;
        }
        .site-table tbody tr:hover {
            background: #eef3f8;
        }

        /* 팝업의 "해야 할 일 보기" 버튼 */
        .go-panel {
            margin-top: 8px;
            padding: 4px 10px;
            border: 1px solid #1d72b8;
            border-radius: 4px;
            background: white;
            color: #1d72b8;
            font-size: 12px;
            cursor: pointer;
        }
        .go-panel:hover {
            background: #1d72b8;
            color: white;
        }

        /* 휴대폰 화면 */
        @media (max-width: 600px) {
            body {
                margin: 0;
            }
            #map {
                height: 60vh;
            }
            #search-box,
            #result-panel,
            #data-source {
                margin-left: 8px !important;
                margin-right: 8px !important;
            }
            #search-box {
                margin-top: 8px !important;
            }
            #result-panel {
                padding: 10px 12px;
            }
            #result-panel .inputs label {
                width: 100%;
            }
            #result-panel .inputs input,
            #result-panel .inputs select {
                flex: 1;
            }
            /* 좁은 화면에서는 범례 글씨를 조금 줄임 */
            .map-legend {
                font-size: 11px;
                line-height: 17px;
            }
        }

        /* 지도 범례 */
        .map-legend {
            background: white;
            padding: 6px 10px;
            font-size: 12px;
            line-height: 20px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .map-legend .legend-title {
            display: block;
            width: 100%;
            margin-bottom: 2px;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
        }
        .map-legend.is-collapsed .legend-items {
            display: none;
        }
        .map-legend.is-collapsed .legend-title {
            margin-bottom: 0;
        }
        .map-legend.is-collapsed .legend-arrow {
            display: inline-block;
            transform: rotate(-90deg);
        }

        /* 터치 화면에서는 두 손가락으로 확대·축소하므로 +/- 버튼 숨김 */
        @media (pointer: coarse) {
            .leaflet-control-zoom {
                display: none;
            }
        }
        /* 내 위치 버튼 */
        .locate-button {
            font-size: 15px;
            color: #333;
        }
        .locate-button:hover {
            color: #1d72b8;
        }
        .locate-button.is-loading {
            cursor: wait;
        }
        .map-legend .swatch {
            display: inline-block;
            width: 14px;
            height: 12px;
            margin-right: 6px;
            vertical-align: middle;
            box-sizing: border-box;
        }

        /* 주소 검색 결과 목록 */
        #search-results {
            max-width: 420px;
            margin: 6px 0 0 0;
            padding: 0;
            list-style: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        #search-results li + li {
            border-top: 1px solid #eee;
        }
        #search-results button {
            display: block;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            background: none;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
        }
        #search-results button:hover {
            background: #f3f7fb;
        }
        #search-results button span {
            display: block;
            color: #666;
            font-size: 12px;
        }
        #search-results .search-message {
            padding: 8px 10px;
            color: #666;
            font-size: 13px;
        }

        /* 위험도 등급 */
        .risk-box {
            margin: 10px 0 4px 0;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .risk-box.high { background: #fdecee; border-color: #f3b4bb; }
        .risk-box.caution { background: #fff6dd; border-color: #f0d58a; }
        .risk-box.low { background: #e9f6f3; border-color: #a9dbcf; }
        .risk-box.unknown { background: #f2f2f2; border-color: #ccc; }
        .risk-title {
            font-size: 16px;
            font-weight: bold;
        }
        .risk-box ul {
            margin: 6px 0 0 0;
            padding-left: 18px;
        }
        .risk-note {
            margin: 6px 0 0 0;
            font-size: 12px;
            color: #666;
        }
        .risk-criteria {
            margin-top: 6px;
            font-size: 13px;
        }
        .risk-criteria summary {
            cursor: pointer;
            color: #1d72b8;
        }
        .risk-criteria table {
            margin-top: 6px;
            border-collapse: collapse;
            width: 100%;
        }
        .risk-criteria th,
        .risk-criteria td {
            padding: 4px 6px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            text-align: left;
            vertical-align: top;
        }
        .risk-criteria th {
            white-space: nowrap;
        }

        /* 진단 결과 패널 */
        #result-panel {
            max-width: 720px;
            margin: 0 0 12px 0;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }
        #result-panel h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        #result-panel h4 {
            margin: 14px 0 6px 0;
            font-size: 14px;
        }
        #result-panel .panel-sub {
            margin: 0;
            color: #666;
            font-size: 13px;
        }
        #result-panel .inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 10px;
            font-size: 13px;
        }
        #result-panel .inputs label {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #result-panel .inputs label[hidden] {
            display: none;
        }
        #result-panel .inputs input,
        #result-panel .inputs select {
            padding: 4px 6px;
            font-size: 13px;
        }
        #result-panel .inputs input {
            width: 100px;
        }
        .step {
            margin: 6px 0;
            padding: 8px 10px;
            border-left: 4px solid #ccc;
            background: #fafafa;
        }
        .step.required { border-left-color: #e63946; }
        .step.check { border-left-color: #e9a400; }
        .step.info { border-left-color: #2a9d8f; }
        .step.yes { border-left-color: #2a9d8f; }
        .step.no { border-left-color: #999; }
        .step.ask { border-left-color: #1d72b8; }
        .step-title {
            font-weight: bold;
        }
        .law {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }
        .law summary {
            cursor: pointer;
        }
        #result-panel ul.notes {
            margin: 0;
            padding-left: 18px;
        }
        #result-panel ul.surveys li {
            margin-bottom: 6px;
        }
        .survey-method {
            display: inline-block;
            padding: 0 6px;
            margin-right: 4px;
            border-radius: 3px;
            background: #eef3f8;
            color: #1d72b8;
            font-size: 12px;
        }
        .survey-report {
            color: #666;
            font-size: 12px;
        }
        .step-items {
            margin: 4px 0 0 0;
            padding-left: 18px;
        }
        .survey-link {
            font-size: 12px;
            color: #1d72b8;
            white-space: nowrap;
        }
        #result-panel .disclaimer {
            margin: 14px 0 0 0;
            font-size: 12px;
            color: #666;
        }

        /* 결과 패널의 걸친 영역 전체 목록 */
        .overlap-list {
            margin-top: 10px;
            font-size: 13px;
        }
        .overlap-list summary {
            cursor: pointer;
        }
        .more-link {
            color: #1d72b8;
            font-size: 12px;
        }

        /* 결과 공유: 링크 복사, PDF 저장 */
        .share-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin: 8px 0 4px 0;
        }
        .share-bar .go-panel {
            margin-top: 0;
        }
        .share-status {
            font-size: 12px;
            color: #2a9d8f;
        }
        .share-link-input {
            width: 100%;
            margin-top: 4px;
            padding: 4px;
            font-size: 12px;
        }
        .print-only {
            display: none;
        }

        /* 인쇄·PDF 저장: 지도와 버튼을 빼고 결과 패널만 */
        @media print {
            body {
                margin: 0;
            }
            #map,
            #search-box,
            .share-bar,
            #result-panel .go-panel {
                display: none !important;
            }
            #result-panel {
                max-width: none;
                margin: 0 !important;
                padding: 0;
                border: none;
                font-size: 12px;
            }
            #result-panel .print-only {
                display: block;
                margin-bottom: 10px;
                padding-bottom: 8px;
                border-bottom: 2px solid #333;
                font-size: 12px;
            }
            .print-only .print-title {
                font-size: 18px;
                font-weight: bold;
            }
            .print-only .print-link {
                word-break: break-all;
            }
            .site-table-wrap {
                overflow: visible;
            }
            .risk-box,
            .step,
            .site-table tr {
                break-inside: avoid;
            }
            /* 위험도·안내 색이 인쇄에서 빠지지 않게 */
            .risk-box,
            .step,
            .survey-method {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #data-source {
                margin: 10px 0 0 0 !important;
            }
        }
    </style>
</head>
<body>    
    <!-- 2. 지도가 들어갈 공간 -->
    <div id="map"></div>

    <!-- 주소 검색 UI 패널 -->
    <div id="search-box" style="margin-bottom: 10px; z-index: 1000; position: relative;">
        <div class="search-row">
            <input
                type="text"
                id="address-input"
                placeholder="지번, 도로명, 장소 또는 좌표 (예: 경주시 인왕동 815-1)"
            >
            <button id="search-btn">검색</button>
            <button id="dxf-btn" type="button" title="DXF 도면으로 사업부지 전체 진단">도면(DXF)</button>
            <input id="dxf-input" type="file" accept=".dxf">
        </div>
        <!-- 검색 결과가 여러 개일 때 고르는 목록 -->
        <ul id="search-results" hidden></ul>
    </div>

    <!-- 진단 결과 패널: 필지를 누르면 해야 할 일과 비용 안내 표시 -->
    <section id="result-panel" hidden></section>

    <!-- 데이터 출처 표시 -->
    <p id="data-source" style="margin: 0 0 10px 0; font-size: 12px; color: #666;">
        출처: 국가유산청 국가유산 공간정보서비스(문화유적분포지도, 국가유산조사구역), 국토교통부 브이월드(국가유산 지정/보호구역, 지적도), OpenStreetMap
    </p>

    <!-- 3. Leaflet 자바스크립트 불러오기 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 다음 단계 안내 규칙 -->
    <script src="guidance.js"></script>

    <script>
        // 지도 초기화 (서울 시청 위경도 좌표 [37.5665, 126.9780], 줌 레벨 13)
        const map = L.map('map').setView([37.5665, 126.9780], 13);

        // 오픈스트리트맵(무료 배경 지도) 입히기
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // VWorld 지적도 WMS 레이어 생성
        const cadastralLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',

                // BUBBLE이 아니라 BUBUN
                layers: 'lp_pa_cbnd_bubun,lp_pa_cbnd_bonbun',

                // 잘못된 스타일명을 보내지 않고 기본 스타일 사용
                styles: '',

                format: 'image/png',
                transparent: true,
                crs: L.CRS.EPSG3857,

                // VWorld는 줌 17 미만에서 빈 이미지를 보내므로 17부터 요청
                minZoom: 17,
                maxZoom: 19
            }
        ).addTo(map);

        // VWorld 국가유산 지정/보호구역 WMS 레이어 생성 (줌 10부터 표시됨)
        const heritageLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',
                layers: 'lt_c_uo301',
                styles: 'lt_c_uo301',
                format: 'image/png',
                transparent: true,
                opacity: 0.6,
                crs: L.CRS.EPSG3857,
                minZoom: 10,
                maxZoom: 19
            }
        ).addTo(map);

        // 국가유산청 문화유적분포지도 (줌 15부터 1.2km 칸 단위로 도형을 받아 그림)
        const SITES_MIN_ZOOM = 15;
        const sitesLayer = L.geoJSON(null, {
            interactive: false,
            style: {
                // VWorld 보호구역(파란 빗금)과 구분되도록 보라색 사용
                color: '#7b2cbf',
                weight: 1.5,
                fillColor: '#9d4edd',
                fillOpacity: 0.25
            }
        }).addTo(map);
        // 국가유산청 현상변경 허용기준 구역 (기본은 꺼둠). 1구역(가장 엄격)일수록 진하게
        const ALLOWANCE_COLORS = { '1': '#d62828', '2': '#f77f00', '3': '#fcbf49', '4': '#90be6d', '5': '#43aa8b' };
        const allowanceLayer = L.geoJSON(null, {
            interactive: false,
            style: feature => {
                const color = ALLOWANCE_COLORS[(feature.properties.zoneCode || '').charAt(1)] || '#577590';
                return { color, weight: 1.5, dashArray: '4 3', fillColor: color, fillOpacity: 0.12 };
            }
        });

        // 세계유산 구역·완충구역 (기본은 꺼둠, 색은 국가유산공간정보서비스와 비슷하게)
        const WORLD_STYLES = {
            core: { color: '#008f87', fillColor: '#2ad1c9', fillOpacity: 0.3, weight: 1.5 },
            buffer: { color: '#ff7078', fillColor: '#ff7078', fillOpacity: 0.15, weight: 1.5, dashArray: '6 4' },
            district: { color: '#5e17eb', fillOpacity: 0, weight: 2.5 }
        };
        const worldLayer = L.geoJSON(null, {
            interactive: false,
            style: feature => WORLD_STYLES[feature.properties.kind] || WORLD_STYLES.core
        });

        // 줌 15 타일 칸 단위로 도형을 받아 레이어에 그림 (이미 받은 칸과 도형은 다시 그리지 않음)
        function createTileLoader(layer, query, label) {
            const loadedTiles = new Set();
            const loadedIds = new Set();

            return function load() {
                if (!map.hasLayer(layer) || map.getZoom() < SITES_MIN_ZOOM) return;

                const bounds = map.getBounds();
                const min = map.project(bounds.getNorthWest(), SITES_MIN_ZOOM).divideBy(256).floor();
                const max = map.project(bounds.getSouthEast(), SITES_MIN_ZOOM).divideBy(256).floor();

                for (let x = min.x; x <= max.x; x++) {
                    for (let y = min.y; y <= max.y; y++) {
                        const tileKey = `${x}/${y}`;
                        if (loadedTiles.has(tileKey)) continue;
                        loadedTiles.add(tileKey);

                        fetch(`/api/heritage-sites?x=${x}&y=${y}${query}`)
                            .then(response => {
                                if (!response.ok) throw new Error(`${label} 조회 실패`);
                                return response.json();
                            })
                            .then(data => {
                                // 여러 칸에 걸친 도형은 한 번만 그림
                                const newFeatures = data.features.filter(feature => !loadedIds.has(feature.properties.id));
                                newFeatures.forEach(feature => loadedIds.add(feature.properties.id));
                                layer.addData(newFeatures);
                            })
                            .catch(error => {
                                console.error(`${label} 불러오기 오류:`, error);
                                loadedTiles.delete(tileKey); // 다음 이동 때 다시 시도
                            });
                    }
                }
            };
        }

        const loadSites = createTileLoader(sitesLayer, '', '문화유적분포지도');
        const loadAllowance = createTileLoader(allowanceLayer, '&layer=allowance', '현상변경 허용기준');

        map.on('moveend overlayadd', loadSites);
        map.on('moveend overlayadd', loadAllowance);
        const loadWorld = createTileLoader(worldLayer, '&layer=world', '세계유산');
        map.on('moveend overlayadd', loadWorld);
        loadSites();


        // 지도 컨트롤 버튼 생성
        const overlayMaps = {
            "지적도 표시": cadastralLayer,
            "국가유산 구역 표시": heritageLayer,
            "문화유적 분포 범위 표시": sitesLayer,
            "현상변경 허용기준 구역 표시": allowanceLayer,
            "세계유산 구역·완충구역 표시": worldLayer
        };
        L.control.layers(null, overlayMaps).addTo(map);

        // 범례: 지도 색깔이 무엇을 뜻하는지 표시 (VWorld 색은 GetLegendGraphic 기준)
        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'map-legend');
            div.innerHTML = `
                <button type="button" class="legend-title" aria-expanded="true">범례 <span class="legend-arrow">▾</span></button>
                <div class="legend-items">
                    <div><span class="swatch" style="background: #ffff4d; border: 1px solid #c9c900;"></span>국가·시도 지정유산 구역</div>
                    <div><span class="swatch" style="background: repeating-linear-gradient(135deg, #4bb3e8 0 2px, #fff 2px 4px);"></span>보호구역</div>
                    <div><span class="swatch" style="border: 2px solid #4caf50;"></span>역사문화환경 보존지역</div>
                    <div><span class="swatch" style="background: rgba(157, 78, 221, 0.25); border: 1.5px solid #7b2cbf;"></span>문화유적 분포 범위</div>
                    <div><span class="swatch" style="border: 1.5px dashed #d62828;"></span>현상변경 허용기준 구역 (켰을 때, 빨강 1구역 → 초록 바깥 구역)</div>
                    <div><span class="swatch" style="background: rgba(42, 209, 201, 0.3); border: 1.5px solid #008f87;"></span>세계유산 구역 (켰을 때)</div>
                    <div><span class="swatch" style="border: 1.5px dashed #ff7078;"></span>세계유산 완충구역 (켰을 때)</div>
                    <div><span class="swatch" style="border: 1.5px solid #e8a33d;"></span>지적도(필지 경계)</div>
                </div>
            `;

            // 제목을 누르면 접고 펼침. 휴대폰처럼 좁은 화면에서는 접힌 채로 시작
            const toggle = div.querySelector('.legend-title');
            const setOpen = (open) => {
                div.classList.toggle('is-collapsed', !open);
                toggle.setAttribute('aria-expanded', String(open));
            };
            setOpen(!window.matchMedia('(max-width: 600px)').matches);
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.on(toggle, 'click', () => setOpen(div.classList.contains('is-collapsed')));
            return div;
        };
        legend.addTo(map);

        // 켜져 있는 레이어가 현재 줌에서 안 보이면 안내 문구 표시
        const CADASTRAL_MIN_ZOOM = 17;
        const zoomHint = L.control({ position: 'bottomleft' });
        zoomHint.onAdd = function() {
            const div = L.DomUtil.create('div');
            div.style.cssText = 'background: white; padding: 6px 10px; font-size: 13px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);';
            return div;
        };

        function updateZoomHint() {
            const hidden = [];
            if (map.hasLayer(sitesLayer) && map.getZoom() < SITES_MIN_ZOOM) hidden.push('문화유적 분포 범위');
            if (map.hasLayer(cadastralLayer) && map.getZoom() < CADASTRAL_MIN_ZOOM) hidden.push('지적도');

            if (hidden.length > 0) {
                zoomHint.addTo(map);
                zoomHint.getContainer().textContent = `${hidden.join(', ')}는 더 확대하면 표시됩니다.`;
            } else {
                zoomHint.remove();
            }
        }

        map.on('zoomend overlayadd overlayremove', updateZoomHint);
        updateZoomHint();

        // 지도 위 핀은 하나만 유지 (내 위치, 검색, 클릭 중 마지막 것만 표시)
        let activeMarker = null;
        let parcelHighlight = null;
        // 결과 공유 상태: 링크에 담을 위치, 진단 시각, 공유 링크로 열었을 때 채울 입력값
        let shareLocation = null;
        let panelLocation = null; // 지금 결과 패널이 보여주는 위치 (새 진단이 끝나기 전엔 이전 위치)
        let diagnosedAt = null;
        let sharedInputs = null;

        function placeMarker(latlng) {
            if (activeMarker) map.removeLayer(activeMarker);
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = null;
            activeMarker = L.marker(latlng).addTo(map);
            return activeMarker;
        }

        // 진단한 필지를 지도에 강조 표시
        function highlightParcel(geometry) {
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = L.geoJSON(geometry, {
                interactive: false,
                style: {
                    color: '#d62828',
                    weight: 3,
                    fillColor: '#d62828',
                    fillOpacity: 0.08
                }
            }).addTo(map);
        }

        // 내 위치 버튼: 첫 화면에서 묻지 않고, 사용자가 원할 때만 위치 권한 요청
        const locateControl = L.control({ position: 'bottomright' });
        locateControl.onAdd = function() {
            const container = L.DomUtil.create('div', 'leaflet-bar');
            const button = L.DomUtil.create('a', 'locate-button', container);
            button.href = '#';
            button.title = '내 위치로 이동';
            button.setAttribute('role', 'button');
            button.setAttribute('aria-label', '내 위치로 이동');
            button.innerHTML = '<i class="fa-solid fa-location-arrow" aria-hidden="true"></i>';

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.preventDefault(e);
                findMyLocation(button);
            });
            return container;
        };
        locateControl.addTo(map);

        function findMyLocation(button) {
            if (!('geolocation' in navigator)) {
                alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
                return;
            }

            const icon = button.querySelector('i');
            const stopLoading = () => {
                button.classList.remove('is-loading');
                icon.className = 'fa-solid fa-location-arrow';
            };
            button.classList.add('is-loading');
            icon.className = 'fa-solid fa-spinner fa-spin';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    stopLoading();
                    const lat = position.coords.latitude;   // 위도
                    const lng = position.coords.longitude; // 경도

                    // 지도의 중심을 내 위치로 이동 (지적도가 보이는 줌 레벨 17)
                    map.setView([lat, lng], 17);
                    placeMarker([lat, lng])
                        .bindPopup('내 위치<br><span style="font-size: 12px; color: #666;">진단하려면 지도에서 필지를 눌러주세요.</span>')
                        .openPopup();
                },
                function(error) {
                    stopLoading();
                    console.warn('위치 정보를 가져올 수 없습니다:', error.message);
                    alert('위치 정보를 가져올 수 없습니다. 브라우저의 위치 권한을 확인해 주세요.');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 검색창 이벤트
        const addressInput = document.getElementById('address-input');
        addressInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('search-btn').click();
            }
        });

        // 주소·장소 검색 (VWorld 검색 API, 지번·도로명·장소 이름)
        const searchResults = document.getElementById('search-results');

        function showSearchMessage(message) {
            searchResults.innerHTML = `<li class="search-message">${escapeHtml(message)}</li>`;
            searchResults.hidden = false;
        }

        // 검색 결과로 이동해서 바로 필지 진단
        function goToResult(result) {
            searchResults.hidden = true;
            const latlng = L.latLng(result.lat, result.lng);
            map.setView(latlng, 18);
            diagnose(latlng);
        }

        // 좌표 입력: "198342.5, 451230.1", "X=451230 Y=198342", "37.5786 126.977" 같은 숫자 두 개
        // ("815-1" 같은 번지는 숫자 하나로 보고 좌표로 다루지 않음)
        function parseCoordinates(keyword) {
            const tokens = keyword.replace(/[XYxy]\s*[=:]?|[()]/g, ' ').trim().split(/[\s,]+/);
            return tokens.length === 2 && tokens.every(token => /^-?\d+(?:\.\d+)?$/.test(token))
                ? tokens.map(Number)
                : null;
        }

        // 좌표계마다 그 숫자가 어디인지 계산해 필지 주소와 함께 보여주고 고르게 함
        async function searchCoordinates([first, second]) {
            showSearchMessage('좌표계별 위치를 확인하는 중...');
            await loadDxfLibs();
            const candidates = window.dxfSite.pointCandidates(first, second);
            if (candidates.length === 0) {
                showSearchMessage('어느 좌표계로 계산해도 우리나라 안이 아니에요. 숫자를 다시 확인해 주세요.');
                return;
            }

            const points = candidates.map(item => item.center.join(',')).join('|');
            const response = await fetch(`/api/site?points=${encodeURIComponent(points)}`);
            const addresses = response.ok ? (await response.json()).addresses : [];
            const results = candidates
                .map((item, index) => ({
                    label: addresses[index] || '지적도에 없는 곳 (바다 등)',
                    sub: `${item.name} · EPSG:${item.code}${item.swapped ? ' · 앞뒤 숫자를 바꿔 계산' : ''}`,
                    lng: item.center[0],
                    lat: item.center[1],
                    found: Boolean(addresses[index])
                }))
                // 필지가 있는(땅 위인) 후보가 있으면 그것만 보여줌
                .filter((result, index, list) => result.found || !list.some(other => other.found));

            if (results.length === 1 && results[0].found) {
                goToResult(results[0]);
                return;
            }
            searchResults.innerHTML = '<li class="search-message">좌표계에 따라 위치가 달라져요. 맞는 곳을 골라 주세요.</li>';
            results.forEach(result => {
                const item = document.createElement('li');
                const button = document.createElement('button');
                button.type = 'button';
                button.innerHTML = `<b>${escapeHtml(result.label)}</b><span>${escapeHtml(result.sub)}</span>`;
                button.addEventListener('click', () => goToResult(result));
                item.appendChild(button);
                searchResults.appendChild(item);
            });
            searchResults.hidden = false;
        }

        document.getElementById('search-btn').addEventListener('click', function() {
            const keyword = addressInput.value.trim();

            if (keyword.length < 2) {
                showSearchMessage('주소나 장소 이름을 2글자 이상 입력해 주세요.');
                return;
            }

            const coordinates = parseCoordinates(keyword);
            if (coordinates) {
                searchCoordinates(coordinates).catch(error => {
                    console.error('좌표 검색 오류:', error);
                    showSearchMessage('좌표 위치를 확인하지 못했어요. 잠시 후 다시 시도해 주세요.');
                });
                return;
            }

            showSearchMessage('검색 중...');

            fetch(`/api/search?query=${encodeURIComponent(keyword)}`)
                .then(response => {
                    if (!response.ok) throw new Error('주소 검색 실패');
                    return response.json();
                })
                .then(data => {
                    if (data.results.length === 0) {
                        showSearchMessage('찾는 주소가 없어요. 지번(예: 경주시 인왕동 815-1)이나 도로명(예: 세종대로 110)으로 검색해 보세요.');
                        return;
                    }
                    if (data.results.length === 1) {
                        goToResult(data.results[0]);
                        return;
                    }

                    searchResults.innerHTML = '';
                    data.results.forEach(result => {
                        const item = document.createElement('li');
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.innerHTML = `<b>${escapeHtml(result.label)}</b>${result.sub ? `<span>${escapeHtml(result.sub)}</span>` : ''}`;
                        button.addEventListener('click', () => goToResult(result));
                        item.appendChild(button);
                        searchResults.appendChild(item);
                    });
                    searchResults.hidden = false;
                })
                .catch(error => {
                    console.error('주소 검색 오류:', error);
                    showSearchMessage('주소 검색에 실패했어요. 잠시 후 다시 시도해 주세요.');
                });
        });

        // 팝업에 넣는 VWorld 텍스트의 HTML 특수문자 처리
        // 국가유산청 발굴조사 보고서·현황 목록 (e-minwon, 국가유산청 홈페이지에 들어가 있는 목록)
        // 주소에 검색어를 넣으면 걸러진 목록이 열림. 보고서는 띄어쓴 단어가 모두 들어간 것을 찾아줌
        const REPORT_SEARCH_URL = 'https://www.e-minwon.go.kr/ge/ee/getListEcexmRptp.do?txtRptNm=';
        const STATUS_SEARCH_URL = 'https://www.e-minwon.go.kr/ge/ee/getListEcexmPrmsnAply.do?searchVal=';

        // 조사명에서 "괘릉리 산37-1"처럼 동·리 이름과 번지를 뽑아 보고서 검색어로 씀
        function reportSearchWord(name) {
            const match = (name || '').match(/([가-힣0-9]+(?:동|리|가))\s*\(?\s*(산\s?\d+(?:-\d+)?|\d+(?:-\d+)?)?/);
            if (!match) return null;
            return match[2] ? `${match[1]} ${match[2].replace(/\s/g, '')}` : match[1];
        }

        function reportSearchLink(name) {
            const word = reportSearchWord(name);
            return word
                ? `<a class="survey-link" href="${REPORT_SEARCH_URL}${encodeURIComponent(word)}" target="_blank" rel="noopener">보고서 찾기 ↗</a>`
                : '';
        }

        // 필지 주소에서 동·리 이름 (발굴조사 현황은 주소 한 칸에서 그대로 찾아서 동·리 이름만 넣음)
        // 필지 주소에서 관할 시·군·구 (일반구가 있는 시는 시청이 담당하는 경우가 많아 시까지만)
        // 같은 이름(고성군 등)이 있어 시·도를 붙임. 예: "경상북도 경주시 인왕동" → 경상북도 경주시, "세종특별자치시 …" → 세종특별자치시
        function addressDistrict(address) {
            const [sido, sigungu] = (address || '').split(' ');
            if (!sido) return null;
            return /세종/.test(sido) || !sigungu ? sido : `${sido} ${sigungu}`;
        }

        // 시·군·구 문화유산 담당 부서 이름 (scripts/update-departments.mjs로 행정표준코드 기관코드에서 만듦)
        let departmentData = null;
        fetch('data/departments.json')
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                departmentData = data;
                if (data && lastParcelResult && !resultPanel.hidden) renderGuidance();
            })
            .catch(() => {});

        // 기관코드 자료와 주소의 시·도 이름이 다를 수 있어 맞춤 (예: 2026년 전남·광주 통합)
        const SIDO_ALIASES = {
            전라남도: '전남광주통합특별시',
            광주광역시: '전남광주통합특별시',
            강원도: '강원특별자치도',
            전라북도: '전북특별자치도'
        };

        function findDepartment(district) {
            if (!departmentData || !district) return null;
            const districts = departmentData.districts;
            const [sido, sigungu] = district.split(' ');
            const keys = [district, sigungu ? `${SIDO_ALIASES[sido] || sido} ${sigungu}` : null].filter(Boolean);
            const key = keys.find(name => districts[name]);
            if (key) return { key, ...districts[key] };

            // 시·도 이름이 또 바뀐 경우: 시·군·구 이름이 하나뿐이면 그것으로
            const matches = sigungu ? Object.keys(districts).filter(name => name.endsWith(` ${sigungu}`)) : [];
            return matches.length === 1 ? { key: matches[0], ...districts[matches[0]] } : null;
        }

        // 부서가 속한 청 이름: 종로구 → 종로구청, 세종특별자치시 → 세종특별자치시청
        function officeName(district) {
            const name = district.split(' ').pop();
            return /(시|군|구)$/.test(name) ? `${name}청` : name;
        }

        // 관할 시·군·구 문화유산 담당 부서 (부서 이름은 행정표준코드, 전화번호는 자료에 없어 검색·110 안내)
        function contactSection(address) {
            const district = addressDistrict(address);
            if (!district) return '';

            const found = findDepartment(district);
            const office = officeName(district);
            const deptName = path => path.split(' ').pop();
            const deptLabel = path => {
                const parts = path.split(' ');
                return `${escapeHtml(office)} <b>${escapeHtml(parts.pop())}</b>${parts.length ? ` <span style="color: #666;">(${escapeHtml(parts.join(' '))})</span>` : ''}`;
            };

            let title;
            let body;
            let searchWord;
            if (found && found.sure) {
                title = `관할 부서: ${found.departments.map(deptLabel).join(', ')}`;
                body = '위 안내에서 "관할 시·군·구에 문의"는 이 부서를 말해요.';
                searchWord = `${office} ${deptName(found.departments[0])} 전화번호`;
            } else if (found) {
                title = `관할 부서(추정): ${found.departments.map(deptLabel).join(', ')}`;
                body = `${escapeHtml(office)}에는 이름에 '문화유산'이 들어간 부서가 없어서, 문화 업무 부서를 찾았어요. 이 부서 안의 문화유산 담당 팀이 맡는 경우가 많지만, 다른 부서일 수도 있으니 전화할 때 문화유산(현상변경·매장유산) 담당인지 확인해 보세요.`;
                searchWord = `${office} ${deptName(found.departments[0])} 전화번호`;
            } else {
                title = `관할: ${escapeHtml(district)} 문화유산 담당 부서`;
                body = '부서 이름을 찾지 못했어요. 지자체마다 부서 이름이 달라요(문화유산과, 문화예술과, 문화관광과 등).';
                searchWord = `${district} 문화유산 담당 부서 전화번호`;
            }

            const source = found && departmentData.baseDate
                ? `<p class="disclaimer" style="margin-top: 4px;">부서 이름: 행정안전부 행정표준코드 기관코드 (${escapeHtml(departmentData.baseDate)} 기준). 조직 개편으로 바뀌었을 수 있어요.</p>`
                : '';

            return `
                <h4>문의처</h4>
                <div class="step info">
                    <div class="step-title">${title}</div>
                    <div>${body}</div>
                    <ul class="step-items">
                        <li><a class="survey-link" href="https://search.naver.com/search.naver?query=${encodeURIComponent(searchWord)}" target="_blank" rel="noopener">${found ? '전화번호 찾기' : `${escapeHtml(district)} 문화유산 담당 부서 찾기`} ↗</a></li>
                        <li>찾기 어려우면 정부민원안내콜센터 ☎ <a class="survey-link" href="tel:110">110</a>에 "${escapeHtml(district)} 문화유산 담당 부서"를 물어보면 연결해 줘요.</li>
                    </ul>
                    ${source}
                </div>`;
        }

        function addressDong(address) {
            const words = (address || '').split(' ').filter(word => /(동|리|가)$/.test(word) && !/(시|군|구|읍|면)$/.test(word));
            return words[words.length - 1] || null;
        }

        // 조사기관 연락처 (한국문화유산협회 회원기관 목록에 있는 기관만)
        function agencyContact(agency) {
            if (!agency) return '';
            const home = agency.homepage
                ? ` · <a class="survey-link" href="${encodeURI(agency.homepage)}" target="_blank" rel="noopener">홈페이지 ↗</a>`
                : '';
            return `<div class="survey-report">조사기관 ${escapeHtml(agency.name)} · ☎ <a class="survey-link" href="tel:${escapeHtml(agency.phone.split(/[\s/,]/)[0])}">${escapeHtml(agency.phone)}</a>${home}</div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        map.on('click', function(e) {
            diagnose(e.latlng);
        });

        // ---------------------------------------------------------------
        // 도면(DXF)으로 사업부지 진단: 파일 고르기 → 경계 레이어·좌표계 고르기 → 부지 전체 + 필지별 진단
        // 도면 파일은 브라우저 안에서만 읽고, 서버에는 바꾼 경계 좌표만 보냄
        // ---------------------------------------------------------------
        const DXF_LIBS = [
            'https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js',
            'https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js',
            'dxf-site.js'
        ];
        let dxfLibsLoading = null;
        const siteLayer = L.layerGroup().addTo(map);
        let siteDraft = null;
        let lastSiteResponse = null;

        // 도면 기능은 쓸 때만 라이브러리를 불러옴 (순서대로)
        function loadDxfLibs() {
            if (!dxfLibsLoading) {
                dxfLibsLoading = DXF_LIBS.reduce((previous, src) => previous.then(() => new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error(`${src} 불러오기 실패`));
                    document.head.appendChild(script);
                })), Promise.resolve());
                dxfLibsLoading.catch(() => { dxfLibsLoading = null; });
            }
            return dxfLibsLoading;
        }

        function showSiteMessage(message) {
            resultPanel.innerHTML = `<h3>도면으로 사업부지 진단</h3><p>${message}</p>`;
            resultPanel.hidden = false;
            scrollToPanel();
        }

        document.getElementById('dxf-btn').addEventListener('click', () => {
            document.getElementById('dxf-input').click();
        });
        document.getElementById('dxf-input').addEventListener('change', event => {
            const file = event.target.files[0];
            event.target.value = ''; // 같은 파일을 다시 골라도 동작하도록
            if (file) handleDxfFile(file);
        });

        async function handleDxfFile(file) {
            showSiteMessage('도면을 읽는 중이에요...');
            try {
                await loadDxfLibs();
                const text = window.dxfSite.decodeDxf(await file.arrayBuffer());
                const { layers, elevations } = window.dxfSite.readBoundaries(text);
                if (layers.length === 0) {
                    showSiteMessage('도면에서 닫힌 경계선(닫힌 폴리라인)을 찾지 못했어요. 사업부지 경계를 닫힌 폴리라인으로 그린 DXF인지 확인해 주세요.');
                    return;
                }
                siteDraft = { fileName: file.name, layers, elevations, layerIndex: 0, crs: null };
                await renderSiteSetup();
            } catch (error) {
                console.error('도면 읽기 오류:', error);
                showSiteMessage('도면을 읽지 못했어요. DXF 형식(ASCII)으로 저장한 파일인지 확인해 주세요.');
            }
        }

        // 1. 경계 레이어, 2. 좌표계 고르기. 좌표계 후보마다 그렇게 읽으면 어느 주소가 되는지 보여줌
        async function renderSiteSetup() {
            const draft = siteDraft;
            const layer = draft.layers[draft.layerIndex];
            showSiteMessage('좌표계 후보 위치를 확인하는 중이에요...');

            const candidates = window.dxfSite.crsCandidates(layer);
            let addresses = [];
            if (candidates.length > 0) {
                const points = candidates.map(item => item.center.join(',')).join('|');
                const response = await fetch(`/api/site?points=${encodeURIComponent(points)}`);
                addresses = response.ok ? (await response.json()).addresses : [];
            }
            if (draft !== siteDraft) return; // 그사이 다른 파일을 골랐으면 무시

            // 지적도에 없는 곳(바다·국외)으로 떨어지는 후보는 뺌
            draft.candidates = candidates
                .map((item, index) => ({ ...item, address: addresses[index] || null }))
                .filter(item => item.address);
            if (!draft.candidates.some(item => item.code === draft.crs)) draft.crs = null;
            if (draft.candidates.length === 1) draft.crs = draft.candidates[0].code;

            const layerItems = draft.layers.map((item, index) => `
                <li><label>
                    <input type="radio" name="site-layer" value="${index}" ${index === draft.layerIndex ? 'checked' : ''}>
                    <b>${escapeHtml(item.name)}</b> · 경계 ${item.polygons.length}개 · 약 ${formatArea(Math.round(item.area))}
                    ${item.scale !== 1 ? '<span class="site-option-note">(mm 단위 도면으로 보고 m로 바꿨어요)</span>' : ''}
                </label></li>`).join('');

            const crsItems = draft.candidates.map(item => `
                <li><label>
                    <input type="radio" name="site-crs" value="${item.code}" ${item.code === draft.crs ? 'checked' : ''}>
                    <b>${escapeHtml(item.name)}</b> (EPSG:${item.code}) → <b>${escapeHtml(item.address)}</b> 부근
                    <span class="site-option-note">${escapeHtml(item.note)}</span>
                </label></li>`).join('');

            resultPanel.innerHTML = `
                <h3>도면으로 사업부지 진단</h3>
                <p class="panel-sub">${escapeHtml(draft.fileName)} · 도면은 이 브라우저에서만 읽고, 진단에는 경계 좌표만 보내요.</p>
                <h4>1. 사업부지 경계 레이어</h4>
                <p class="panel-sub">닫힌 선이 있는 레이어예요. 넓은 순으로 보여주고, 다른 경계 안에 있는 경계는 제외 구역으로 봐요.</p>
                <ul class="site-options">${layerItems}</ul>
                <h4>2. 도면 좌표계</h4>
                ${draft.candidates.length > 0 ? `
                    <p class="panel-sub">DXF에는 좌표계 정보가 없어요. 좌표계마다 위치가 달라지니, <b>사업지 주소와 맞는 것</b>을 골라 주세요. 고르면 지도에 경계가 그려져요.</p>
                    <ul class="site-options">${crsItems}</ul>
                    <button type="button" class="site-run" id="site-run" ${draft.crs ? '' : 'disabled'}>이 경계로 진단하기</button>
                ` : `
                    <p>도면 좌표를 어떤 좌표계로 읽어도 우리나라 땅 위에 오지 않아요. 측량 좌표(TM 좌표)가 아니라 임의의 좌표(0,0 기준 등)로 그린 도면일 수 있어요. 측량 성과나 지적 좌표로 맞춘 도면으로 다시 올려 주세요.</p>
                `}
            `;
            resultPanel.hidden = false;

            resultPanel.querySelectorAll('input[name="site-layer"]').forEach(input => {
                input.addEventListener('change', () => {
                    siteDraft.layerIndex = Number(input.value);
                    renderSiteSetup();
                });
            });
            resultPanel.querySelectorAll('input[name="site-crs"]').forEach(input => {
                input.addEventListener('change', () => {
                    siteDraft.crs = Number(input.value);
                    document.getElementById('site-run').disabled = false;
                    previewSite();
                });
            });
            const runButton = document.getElementById('site-run');
            if (runButton) runButton.addEventListener('click', runSite);
            if (draft.crs) previewSite();
        }

        const SITE_BOUNDARY_STYLE = { color: '#1d4ed8', weight: 3, dashArray: '8 4', fillColor: '#1d4ed8', fillOpacity: 0.06 };

        function previewSite() {
            const layer = siteDraft.layers[siteDraft.layerIndex];
            siteDraft.geometry = window.dxfSite.toGeometry(layer, siteDraft.crs);
            siteLayer.clearLayers();
            const boundary = L.geoJSON(siteDraft.geometry, { interactive: false, style: SITE_BOUNDARY_STYLE }).addTo(siteLayer);
            map.fitBounds(boundary.getBounds(), { padding: [20, 20] });
        }

        async function runSite() {
            const geometry = siteDraft.geometry;
            showSiteMessage('사업부지와 걸친 필지를 진단하는 중이에요... 필지가 많으면 1분 가까이 걸릴 수 있어요.');
            try {
                const response = await fetch('/api/site', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ geometry })
                });
                const data = await response.json();
                if (!response.ok) {
                    showSiteMessage(escapeHtml(data.message || '사업부지를 진단하지 못했어요. 잠시 후 다시 시도해 주세요.'));
                    return;
                }
                if (data.parcels.length === 0) {
                    showSiteMessage('경계 안에서 필지를 찾지 못했어요. 좌표계를 다시 확인해 주세요.');
                    return;
                }
                data.parcels.forEach(item => { item.risk = window.buildRisk(item); });
                // 고른 경계 안의 표고 (측량 현황도라면 표고점 글자, 등고선 높이)
                data.elevation = window.dxfSite.siteElevation(siteDraft.layers[siteDraft.layerIndex], siteDraft.elevations);
                lastSiteResponse = data;
                showSitePanel();
            } catch (error) {
                console.error('사업부지 진단 오류:', error);
                showSiteMessage('사업부지를 진단하지 못했어요. 잠시 후 다시 시도해 주세요.');
            }
        }

        const RISK_ORDER = { high: 0, caution: 1, unknown: 2, low: 3 };
        const RISK_COLORS = { high: '#d62828', caution: '#e9a400', unknown: '#999999', low: '#2a9d8f' };

        // 지도에 부지 경계와 필지(위험도 색)를 그림. 필지를 누르면 그 필지 진단을 보여줌
        function drawSiteParcels() {
            const data = lastSiteResponse;
            siteLayer.clearLayers();
            data.parcels.forEach((item, index) => {
                const color = RISK_COLORS[item.risk.level];
                L.geoJSON(item.parcel.geometry, {
                    style: { color, weight: 1, fillColor: color, fillOpacity: 0.25 }
                })
                    .bindTooltip(`${escapeHtml(item.parcel.address)} · 위험도 ${item.risk.icon} ${escapeHtml(item.risk.label)}`)
                    .on('click', event => {
                        L.DomEvent.stopPropagation(event);
                        showSiteParcel(index);
                    })
                    .addTo(siteLayer);
            });
            const boundary = L.geoJSON(data.site.geometry, { interactive: false, style: SITE_BOUNDARY_STYLE }).addTo(siteLayer);
            map.fitBounds(boundary.getBounds(), { padding: [20, 20] });
        }

        // 주소에서 시·도와 시·군·구를 뺀 나머지 (예: "인왕동 811-1")
        function shortAddress(address) {
            const words = (address || '').split(' ');
            return words.slice(/세종/.test(words[0]) ? 1 : 2).join(' ') || address;
        }

        function siteParcelOrder(data) {
            return data.parcels
                .map((item, index) => ({ item, index }))
                .sort((a, b) => (RISK_ORDER[a.item.risk.level] - RISK_ORDER[b.item.risk.level]) ||
                    (b.item.parcel.inSiteArea - a.item.parcel.inSiteArea));
        }

        // 부지 전체 진단: 위험도·해야 할 일은 부지 경계 기준, 아래에 필지별 표
        function showSitePanel() {
            const data = lastSiteResponse;
            const first = data.parcels[0].parcel.address.split(' ');
            const place = first.slice(0, /세종/.test(first[0]) ? 2 : 3).join(' ');
            const siteData = {
                ...data.result,
                target: 'site',
                parcel: {
                    address: `${place} 일원 (도면 사업부지, ${data.site.parcelCount}필지)`,
                    jibun: '',
                    area: data.site.area,
                    geometry: data.site.geometry
                }
            };

            const counts = {};
            data.parcels.forEach(item => { counts[item.risk.level] = (counts[item.risk.level] || 0) + 1; });
            const countText = ['high', 'caution', 'unknown', 'low']
                .filter(level => counts[level])
                .map(level => {
                    const sample = data.parcels.find(item => item.risk.level === level).risk;
                    return `${sample.icon} ${escapeHtml(sample.label)} ${counts[level]}`;
                })
                .join(' · ');

            const rows = siteParcelOrder(data).map(({ item, index }) => `
                <tr onclick="showSiteParcel(${index})">
                    <td style="white-space: nowrap;">${item.risk.icon} ${escapeHtml(item.risk.label)}</td>
                    <td>${escapeHtml(shortAddress(item.parcel.address))}</td>
                    <td class="num">${formatArea(item.parcel.area)}</td>
                    <td class="num">${formatArea(item.parcel.inSiteArea)}</td>
                    <td>${escapeHtml(item.risk.reasons[0] || '')}</td>
                </tr>`).join('');

            const table = `
                <details open>
                    <summary><b>필지별 진단 (${data.site.parcelCount}필지)</b> · ${countText}</summary>
                    <p class="panel-sub">위험도가 높은 순으로 보여줘요. 줄을 누르거나 지도에서 필지를 누르면 그 필지의 진단을 볼 수 있어요.</p>
                    <div class="site-table-wrap">
                        <table class="site-table">
                            <thead><tr><th>위험도</th><th>지번</th><th>필지 면적</th><th>부지 안 면적</th><th>주요 이유</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    <button type="button" class="go-panel" onclick="downloadSiteCsv()">표 내려받기 (CSV)</button>
                    ${data.site.parcelsTruncated ? '<p class="disclaimer">※ 필지가 너무 많아 일부만 진단했어요.</p>' : ''}
                </details>`;

            shareLocation = null;
            updateShareUrl();
            showGuidancePanel(siteData, {
                title: '도면 사업부지 진단 결과 · 해야 할 일',
                areaLabel: '부지 면적',
                extra: table,
                shareable: false,
                elevation: data.elevation
            });
            if (parcelHighlight) map.removeLayer(parcelHighlight);
            parcelHighlight = null;
            drawSiteParcels();
            scrollToPanel();
        }

        function showSiteParcel(index) {
            const item = lastSiteResponse.parcels[index];
            highlightParcel(item.parcel.geometry);
            showGuidancePanel(item, { back: true, shareable: false });
            scrollToPanel();
        }

        // 필지별 표를 CSV로 내려받기 (엑셀에서 한글이 깨지지 않도록 BOM을 붙임)
        function downloadSiteCsv() {
            const data = lastSiteResponse;
            const quote = value => `"${String(value).replace(/"/g, '""')}"`;
            const lines = [
                ['위험도', '주소', '필지 면적(㎡)', '부지 안 면적(㎡)', '이유'].map(quote).join(','),
                ...siteParcelOrder(data).map(({ item }) => [
                    item.risk.label,
                    item.parcel.address,
                    item.parcel.area,
                    item.parcel.inSiteArea,
                    item.risk.reasons.join(' / ')
                ].map(quote).join(','))
            ];
            const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `사업부지_필지별_진단_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // 한 지점의 필지를 진단 (지도 클릭, 주소 검색에서 사용)
        function diagnose(clickedLatlng) {
            // 응답이 늦게 와도 이 클릭의 핀에만 결과를 넣도록 지역 변수로 보관
            const clickMarker = placeMarker(clickedLatlng);
            clickMarker.bindPopup('필지와 국가유산 데이터 확인 중...', { maxWidth: 320 }).openPopup();
            shareLocation = clickedLatlng;
            updateShareUrl();

            const query = `lat=${clickedLatlng.lat}&lng=${clickedLatlng.lng}`;

            // 필지 단위로 진단하고, 지적도에 없는 곳이면 클릭 지점만 진단
            fetch(`/api/parcel?${query}`)
                .then(response => {
                    if (!response.ok) throw new Error('필지 진단 실패');
                    return response.json();
                })
                .then(data => {
                    if (clickMarker !== activeMarker) return; // 그사이 다른 곳을 눌렀으면 무시
                    if (data.parcel) {
                        highlightParcel(data.parcel.geometry);
                        showParcelResult(clickMarker, data);
                        showGuidancePanel(data);
                        return;
                    }
                    resultPanel.hidden = true;
                    return fetch(`/api/heritage?${query}`)
                        .then(response => {
                            if (!response.ok) throw new Error('국가유산 구역 조회 실패');
                            return response.json();
                        })
                        .then(pointData => showResult(clickMarker, pointData));
                })
                .catch(error => {
                    console.error('진단 오류:', error);
                    clickMarker.setPopupContent('국가유산 데이터를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.');
                });
        }

        function formatArea(value) {
            return `${value.toLocaleString('ko-KR')}㎡`;
        }

        // 같은 이름이 여러 번 등록된 유적은 가장 많이 겹친 것 하나만 표시
        function dedupeSites(sites) {
            const byName = new Map();
            sites.forEach(site => {
                const prev = byName.get(site.name);
                if (!prev || site.overlapArea > prev.overlapArea) byName.set(site.name, site);
            });
            return [...byName.values()];
        }

        // 필지(부지)에 걸친 국가유산 구역·문화유적 분포 범위, 많이 겹친 순
        function overlapItems(data) {
            return [
                ...(data.zones || []).map(zone => ({ name: zone.name, type: window.isNaturalZone(zone) ? `${zone.type} · 자연유산` : zone.type, natural: window.isNaturalZone(zone), overlapArea: zone.overlapArea, overlapRatio: zone.overlapRatio, edgeOnly: zone.edgeOnly })),
                ...dedupeSites(data.sites || []).map(site => ({ name: site.name || '이름 없음', type: '문화유적 분포 범위', overlapArea: site.overlapArea, overlapRatio: site.overlapRatio, edgeOnly: site.edgeOnly }))
            ].sort((a, b) => b.overlapArea - a.overlapArea);
        }

        // 이름이 없는 구역(역사문화환경 보존지역 등)은 종류만 표시
        function overlapLabel(item) {
            return item.name
                ? `${escapeHtml(item.name)} <span style="color: #666;">(${escapeHtml(item.type)})</span>`
                : escapeHtml(item.type);
        }

        function showParcelResult(marker, data) {
            const parcel = data.parcel;
            const items = overlapItems(data);

            const realItems = items.filter(item => !item.edgeOnly);
            const edgeItems = items.filter(item => item.edgeOnly);
            const failed = data.zones === null || data.sites === null;

            const parcelInfo = `
                <p style="margin: 0 0 6px 0; font-size: 13px;">
                    <b>${escapeHtml(parcel.address)}</b><br>
                    <span style="color: #666;">지목·지번 ${escapeHtml(parcel.jibun)} · 필지 면적 ${formatArea(parcel.area)}</span>
                </p>`;

            const listItem = item => `<li>${overlapLabel(item)} · ${formatArea(item.overlapArea)} (${item.overlapRatio}%)</li>`;
            // 팝업이 지도를 너무 가리지 않게 많이 겹친 3개만 보여주고, 나머지는 결과 패널의 전체 목록으로 보냄
            const POPUP_ITEM_LIMIT = 3;
            const hiddenCount = realItems.length - POPUP_ITEM_LIMIT;
            const moreLink = hiddenCount > 0
                ? `<li style="list-style: none;"><a href="#" class="more-link" onclick="scrollToOverlaps(); return false;">외 ${hiddenCount}건 모두 보기 ▼</a></li>`
                : '';
            const realList = realItems.length > 0
                ? `<ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${realItems.slice(0, POPUP_ITEM_LIMIT).map(listItem).join('')}${moreLink}</ul>`
                : '';
            const edgeList = edgeItems.length > 0
                ? `<p style="margin: 6px 0 0 0; font-size: 12px; color: #666;">경계에만 걸침 (도면 오차일 수 있음): ${edgeItems.map(item => escapeHtml(item.name || item.type)).join(', ')}</p>`
                : '';
            const failNote = failed
                ? '<p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">※ 일부 데이터를 불러오지 못해 결과가 불완전할 수 있습니다.</p>'
                : '';
            const nearest = (data.nearbySites || [])[0];
            const nearestLine = nearest
                ? `<p style="margin: 6px 0 0 0; font-size: 12px; color: #666;">가장 가까운 문화유적: ${escapeHtml(nearest.name)} · 약 ${nearest.distance}m</p>`
                : '';
            const surveyCount = (data.surveys || []).length;
            const surveyLine = surveyCount > 0
                ? `<p style="margin: 2px 0 0 0; font-size: 12px; color: #666;">주변 500m 조사 이력 ${surveyCount}건${surveyCount >= 10 ? ' 이상' : ''}</p>`
                : '';

            let title;
            let summary;
            if (realItems.length > 0 && realItems.every(item => item.natural)) {
                // 자연유산 구역만 걸친 경우: 매장유산 위험도와 별개라 빨간색으로 표시하지 않음
                title = '<h4 style="margin: 0 0 5px 0; color: #e9a400;">자연유산 구역 해당</h4>';
                summary = `<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> ℹ️ 필지의 <b>${data.overlap.ratio}% (${formatArea(data.overlap.area)})</b>가 자연유산 구역에 걸칩니다. (땅속 유물 절차와는 별개)</p>`;
            } else if (realItems.length > 0) {
                title = '<h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 관련 영역 해당</h4>';
                summary = `<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 필지의 <b>${data.overlap.ratio}% (${formatArea(data.overlap.area)})</b>가 관련 영역에 걸칩니다.</p>`;
            } else if (edgeItems.length > 0) {
                title = '<h4 style="margin: 0 0 5px 0; color: #e9a400;">경계 확인 필요</h4>';
                summary = '<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟡 관련 영역이 필지 경계에만 살짝 걸칩니다.</p>';
            } else if (failed) {
                title = '<h4 style="margin: 0 0 5px 0; color: #666;">확인된 영역 없음</h4>';
                summary = '<p style="margin: 0; font-size: 13px;">관련 영역이 없지만, 일부 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</p>';
            } else {
                title = '<h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 관련 영역 외 지역</h4>';
                summary = '<p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 필지가 관련 영역에 포함되지 않습니다.</p>';
            }

            const risk = window.buildRisk(data);
            const riskLine = `<p style="margin: 0 0 6px 0; font-size: 13px;"><b>위험도 ${risk.icon} ${escapeHtml(risk.label)}</b> <span style="color: #666; font-size: 12px;">(참고자료)</span></p>`;

            marker.setPopupContent(`
                <div style="padding: 5px;">
                    ${title}
                    ${riskLine}
                    ${parcelInfo}
                    ${summary}
                    ${realList}
                    ${edgeList}
                    ${nearestLine}
                    ${surveyLine}
                    ${failNote}
                    <button type="button" class="go-panel" onclick="scrollToPanel()">해야 할 일 보기 ▼</button>
                </div>
            `);
        }

        // 팝업의 "해야 할 일 보기" 버튼: 결과 패널로 부드럽게 이동
        function scrollToPanel() {
            resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 팝업의 "외 N건 모두 보기": 결과 패널의 걸친 영역 전체 목록을 펼치고 그쪽으로 이동
        function scrollToOverlaps() {
            const section = document.getElementById('overlap-list');
            if (!section) return scrollToPanel();
            section.open = true;
            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 결과 패널의 걸친 영역 전체 목록 (3건 이하면 팝업에 다 보이므로 접어 둠)
        function renderOverlapList(data, areaName) {
            const items = overlapItems(data);
            if (items.length === 0) return '';

            const rows = items.map(item => `
                <tr>
                    <td>${overlapLabel(item)}${item.edgeOnly ? ' <span style="color: #666;">· 경계에만 걸침</span>' : ''}</td>
                    <td class="num">${formatArea(item.overlapArea)}</td>
                    <td class="num">${item.overlapRatio}%</td>
                </tr>`).join('');

            return `
                <details class="overlap-list" id="overlap-list"${items.length > 3 ? ' open' : ''}>
                    <summary><b>${escapeHtml(areaName)}에 걸친 영역 ${items.length}건</b></summary>
                    <div class="site-table-wrap">
                        <table class="site-table">
                            <thead><tr><th>이름 (종류)</th><th>겹친 면적</th><th>비율</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    <p class="disclaimer" style="margin-top: 0;">많이 겹친 순이에요. 같은 이름의 문화유적이 여러 번 등록된 경우는 하나만 보여줘요.</p>
                </details>`;
        }

        // 진단 결과 패널 (guidance.js의 규칙으로 해야 할 일과 비용 안내 생성)
        const resultPanel = document.getElementById('result-panel');
        let lastParcelResult = null;

        const WORK_TYPES = [
            ['', '선택 안 함'],
            ['house', '단독주택'],
            ['farm', '농업인·어업인 시설물'],
            ['business', '개인사업자 시설물'],
            ['factory', '공장'],
            ['other', '그 밖의 공사']
        ];

        function readNumber(id) {
            const input = document.getElementById(id);
            if (!input || input.value.trim() === '') return null;
            const value = Number(input.value);
            return Number.isFinite(value) && value >= 0 ? value : null;
        }

        // 지반 해발은 바닷가 매립지처럼 0보다 낮을 수 있음
        function readElevation(id) {
            const input = document.getElementById(id);
            if (!input || input.value.trim() === '') return null;
            const value = Number(input.value);
            return Number.isFinite(value) && value >= -20 && value <= 2000 ? value : null;
        }

        // 도면(DXF)에서 읽은 부지 표고 (도면 사업부지 결과에서만)
        let panelElevation = null;

        // options: title(제목), areaLabel(면적 이름), extra(위험도 아래에 넣을 내용), back(도면 사업부지로 돌아가는 버튼),
        //          shareable(false면 링크 복사 버튼을 빼고 PDF 저장만), elevation(도면에서 읽은 표고)
        function showGuidancePanel(data, options = {}) {
            lastParcelResult = data;
            panelElevation = options.elevation || null;
            diagnosedAt = new Date();
            panelLocation = shareLocation;
            const shareable = options.shareable !== false && shareLocation !== null;
            const workOptions = WORK_TYPES
                .map(([value, label]) => `<option value="${value}">${label}</option>`)
                .join('');

            resultPanel.innerHTML = `
                <div class="print-only" id="print-header"></div>
                ${options.back ? '<button type="button" class="go-panel" onclick="showSitePanel()">← 도면 사업부지 전체로</button>' : ''}
                <h3>${escapeHtml(options.title || '진단 결과 · 해야 할 일')}</h3>
                <p class="panel-sub">${escapeHtml(data.parcel.address)} · ${escapeHtml(options.areaLabel || '필지 면적')} ${formatArea(data.parcel.area)}</p>
                <div class="share-bar">
                    ${shareable ? '<button type="button" class="go-panel" onclick="copyShareLink()">🔗 링크 복사</button>' : ''}
                    <button type="button" class="go-panel" onclick="printResult()">🖨️ PDF로 저장·인쇄</button>
                    <span class="share-status" id="share-status" role="status"></span>
                </div>
                <div id="share-fallback"></div>
                ${renderRisk(window.buildRisk(data))}
                ${renderOverlapList(data, data.target === 'site' ? '부지' : '필지')}
                ${options.extra || ''}
                <div class="inputs">
                    <label>공사 종류 <select id="work-type">${workOptions}</select></label>
                    <label>사업(대지) 면적 <input id="land-area" type="number" min="0" step="1" value="${Math.round(data.parcel.area)}"> ㎡</label>
                    <label id="floor-area-field" hidden>건축물 연면적 <input id="floor-area" type="number" min="0" step="1"> ㎡</label>
                    <label>지반 해발 <input id="ground-level" type="number" step="0.01" placeholder="예: 35.2" value="${panelElevation ? panelElevation.median : ''}"> m</label>
                    <label>굴착 깊이 <input id="dig-depth" type="number" min="0" step="0.1" placeholder="예: 3"> m</label>
                </div>
                <div id="guidance-body"></div>
            `;
            resultPanel.hidden = false;

            // 공유 링크로 열었으면 링크에 담긴 공사 종류·면적·해발을 채움 (처음 한 번만)
            if (sharedInputs) {
                document.getElementById('work-type').value = sharedInputs.work;
                if (sharedInputs.area !== null) document.getElementById('land-area').value = sharedInputs.area;
                if (sharedInputs.floor !== null) document.getElementById('floor-area').value = sharedInputs.floor;
                if (sharedInputs.ground !== null) document.getElementById('ground-level').value = sharedInputs.ground;
                if (sharedInputs.depth !== null) document.getElementById('dig-depth').value = sharedInputs.depth;
                sharedInputs = null;
            }

            resultPanel.querySelectorAll('select, input').forEach(element => {
                element.addEventListener('input', renderGuidance);
            });
            renderGuidance();
        }

        // 위험도 등급 박스: 등급, 해당 이유, 펼쳐보는 등급 기준표
        function renderRisk(risk) {
            const reasons = risk.reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
            const criteriaRows = risk.criteria.map(group => `
                <tr>
                    <th>${group.icon} ${escapeHtml(group.label)}</th>
                    <td>${group.rules.map(rule => escapeHtml(rule)).join('<br>')}</td>
                </tr>`).join('');

            return `
                <div class="risk-box ${risk.level}">
                    <div class="risk-title">위험도 ${risk.icon} ${escapeHtml(risk.label)}</div>
                    <div>${escapeHtml(risk.summary)}</div>
                    <ul>${reasons}</ul>
                    <details class="risk-criteria">
                        <summary>산정 근거 보기</summary>
                        <p class="risk-note" style="margin-top: 6px;">위에서부터 확인해 처음 해당하는 등급으로 정하고, 해당하는 이유는 모두 보여줘요.</p>
                        <table>${criteriaRows}</table>
                    </details>
                    <p class="risk-note">위험도는 참고자료일 뿐이에요.</p>
                </div>`;
        }

        function lawDetails(law) {
            return law
                ? `<details class="law"><summary>법령 근거</summary>${escapeHtml(law)}</details>`
                : '';
        }

        // 굴착 깊이: 지반 해발 - 굴착 깊이 = 굴착 바닥 해발
        // (주변 유적층 해발과 비교하는 기능은 보고서 자료를 모아야 해서 아직 없음)
        function excavationSection() {
            const ground = readElevation('ground-level');
            const depth = readNumber('dig-depth');
            const fromDrawing = panelElevation
                ? `<div class="survey-report">도면에서 표고 ${panelElevation.count}개를 읽었어요 (${panelElevation.source === 'text' ? '표고 글자' : '점·등고선 높이'}, 최저 ${panelElevation.min}m ~ 최고 ${panelElevation.max}m). 지반 해발에는 중간값 ${panelElevation.median}m를 넣었어요. 땅이 기울어 있으면 실제 굴착 위치의 값으로 고쳐 주세요.</div>`
                : '';

            let body;
            if (ground !== null && depth !== null) {
                const bottom = Math.round((ground - depth) * 100) / 100;
                body = `
                    <div class="step-title">굴착 바닥 해발 약 ${bottom}m</div>
                    <div>지반 해발 ${ground}m에서 ${depth}m를 파면 바닥은 해발 약 ${bottom}m예요. 주변 발굴조사에서 유구(유적의 흔적)가 나온 해발이 이보다 높으면, 공사가 유적층에 닿을 수 있어요.</div>
                    <ul class="step-items">
                        <li>주변 유적이 어느 해발에서 나왔는지는 아래 "주변 조사 이력"의 보고서나 조사기관에 확인해 보세요. 이 서비스는 아직 유적층 해발 자료가 없어요.</li>
                        <li>얕게 파는 공사라도 유존지역 안이면 국가유산영향진단 대상인 것은 같아요. 굴착 깊이는 진단·협의 때 참고 자료가 돼요.</li>
                    </ul>`;
            } else if (depth !== null) {
                body = '<div>지반 해발을 넣으면 굴착 바닥 해발을 계산해요. 측량도나 설계도의 현황 지반고(EL, GL)를 넣어 주세요.</div>';
            } else if (ground !== null) {
                body = '<div>굴착 깊이(기초·지하층을 위해 파는 깊이)를 넣으면 굴착 바닥 해발을 계산해요.</div>';
            } else {
                body = '<div>위에 지반 해발과 굴착 깊이를 넣으면 굴착 바닥이 해발 몇 m인지 계산해요. 지반 해발은 측량도나 설계도의 현황 지반고(EL, GL)를 보거나, 도면(DXF)을 올리면 자동으로 읽어요.</div>';
            }

            return `
                <h4>굴착 깊이</h4>
                <div class="step info">
                    ${body}
                    ${fromDrawing}
                </div>`;
        }

        function renderGuidance() {
            if (!lastParcelResult) return;

            const workType = document.getElementById('work-type').value;
            document.getElementById('floor-area-field').hidden = workType !== 'business';

            const guidance = window.buildGuidance(lastParcelResult, {
                workType,
                landArea: readNumber('land-area'),
                floorArea: workType === 'business' ? readNumber('floor-area') : null
            });
            updateShareUrl();

            const steps = guidance.steps.map(step => `
                <div class="step ${step.level}">
                    <div class="step-title">${escapeHtml(step.title)}</div>
                    <div>${escapeHtml(step.body)}</div>
                    ${step.items ? `<ul class="step-items">${step.items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : ''}
                    ${step.details ? `<details class="law"><summary>${escapeHtml(step.details.summary)}</summary><ul class="step-items">${step.details.items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul></details>` : ''}
                    ${lawDetails(step.law)}
                </div>`).join('');

            const cost = guidance.cost ? `
                <h4>비용</h4>
                <div class="step info">
                    <div>${escapeHtml(guidance.cost.summary)}</div>
                    ${lawDetails(guidance.cost.law)}
                </div>
                <div class="step ${guidance.cost.support.level}">
                    <div>${escapeHtml(guidance.cost.support.text)}</div>
                    ${lawDetails(guidance.cost.support.law)}
                </div>` : '';

            const nearbySites = lastParcelResult.nearbySites;
            const nearby = nearbySites === null || nearbySites === undefined
                ? ''
                : `
                <h4>주변 문화유적 (500m 이내)</h4>
                ${nearbySites.length > 0
                    ? `<ul class="notes">${nearbySites.map(site => `<li>${escapeHtml(site.name)} · 약 ${site.distance}m${site.mapNo ? ` <span style="color: #666; font-size: 12px;">(분포지도 ${escapeHtml(site.mapNo)})</span>` : ''}</li>`).join('')}</ul>`
                    : '<p class="panel-sub">500m 안에 문화유적 분포 범위가 없어요.</p>'}
                <p class="disclaimer" style="margin-top: 4px;">필지 경계에서 각 유적 분포 범위 경계까지의 가장 짧은 거리예요. 이미 필지와 겹치는 유적은 빼고 가까운 5곳만 보여줘요.</p>`;

            const surveys = lastParcelResult.surveys;
            const surveyItem = survey => `
                <li>
                    <span class="survey-method">${escapeHtml(survey.method)}</span>
                    ${escapeHtml(survey.name || '이름 없음')} ·
                    ${survey.distance === 0 ? '<b>필지에 걸침</b>' : `약 ${survey.distance}m`}${survey.year ? ` · ${survey.year}년` : ''}
                    ${survey.kind === 'excavation' ? reportSearchLink(survey.name) : ''}
                    ${survey.report ? `<div class="survey-report">${escapeHtml(survey.report)}</div>` : ''}
                    ${agencyContact(survey.agency)}
                    ${(survey.followUps || []).length > 0 ? `<div class="survey-report">그 뒤 같은 범위: ${survey.followUps.map(item => `${escapeHtml(item.method)}${item.year ? `(${item.year}년)` : ''} ${reportSearchLink(item.name)}`).join(', ')}</div>` : ''}
                </li>`;
            const dong = addressDong(lastParcelResult.parcel && lastParcelResult.parcel.address);
            const statusLink = dong
                ? `<p class="panel-sub" style="margin-top: 4px;"><a class="survey-link" href="${STATUS_SEARCH_URL}${encodeURIComponent(dong)}" target="_blank" rel="noopener">${escapeHtml(dong)} 발굴조사 허가 현황 보기 ↗</a> <span style="color: #666; font-size: 12px;">(국가유산청, 최근 신청된 조사까지)</span></p>`
                : '';
            const surveySection = surveys === null || surveys === undefined
                ? ''
                : `
                <h4>주변 조사 이력 (500m 이내)</h4>
                ${surveys.length > 0
                    ? `<ul class="notes surveys">${surveys.map(surveyItem).join('')}</ul>`
                    : '<p class="panel-sub">500m 안에 등록된 조사 기록이 없어요.</p>'}
                ${statusLink}
                <p class="disclaimer" style="margin-top: 4px;">국가유산청 국가유산조사구역 자료예요. 가까운 순으로 최대 10건을 보여주고, 조사 종류와 연도는 보고서 이름에서 읽어낸 거라 실제와 다를 수 있어요. "보고서 찾기"는 국가유산청 발굴조사 보고서 목록을 조사 위치로 검색해요. 2017년쯤부터 제출된 발굴·시굴조사 보고서만 있고 지표조사 보고서는 없어서, 예전 조사는 안 나올 수 있어요. 조사기관 연락처는 한국문화유산협회 회원기관 목록에 있는 기관만 보여줘요. 보고서를 보거나 조사 내용을 물어볼 때 연락해 보세요.</p>`;

            const notes = guidance.notes.map(note => `
                <li>${escapeHtml(note.text)} ${lawDetails(note.law)}</li>`).join('');

            const incomplete = guidance.incomplete
                ? '<p class="disclaimer">※ 일부 데이터를 불러오지 못해 안내가 불완전할 수 있어요.</p>'
                : '';

            document.getElementById('guidance-body').innerHTML = `
                <h4>해야 할 일</h4>
                ${steps}
                ${excavationSection()}
                ${cost}
                ${nearby}
                ${surveySection}
                ${contactSection(lastParcelResult.parcel && lastParcelResult.parcel.address)}
                <h4>알아두세요</h4>
                <ul class="notes">${notes}</ul>
                ${incomplete}
                <p class="disclaimer">이 안내는 공공데이터와 법령을 바탕으로 한 <b>참고용 정보</b>이며 법적 판단을 대신하지 않아요. 정확한 내용은 관할 시·군·구 문화유산 담당 부서나 국가유산청에 문의하세요.</p>
            `;
        }

        function showResult(marker, data) {
            const zones = data.zones || [];
            // 같은 이름의 유적이 여러 번 등록된 경우 한 번만 표시
            const sites = (data.sites || []).filter((site, index, list) =>
                list.findIndex(other => other.name === site.name) === index
            );
            const failed = data.zones === null || data.sites === null;
            const failNote = failed
                ? '<p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">※ 일부 데이터를 불러오지 못해 결과가 불완전할 수 있습니다.</p>'
                : '';

            if (zones.length > 0 || sites.length > 0) {
                const zoneItems = zones
                    .map(zone => `<li>${escapeHtml(zone.name || '이름 없음')} <span style="color: #666;">(${escapeHtml(zone.type)})</span></li>`)
                    .join('');
                const siteItems = sites
                    .map(site => `<li>${escapeHtml(site.name || '이름 없음')} <span style="color: #666;">(문화유적 분포 범위)</span></li>`)
                    .join('');
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #e63946;">국가유산 관련 영역 해당</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🔴 관련 영역에 포함됩니다.</p>
                        <ul style="margin: 5px 0 0 0; padding-left: 18px; font-size: 13px;">${zoneItems}${siteItems}</ul>
                        ${failNote}
                    </div>
                `);
            } else if (failed) {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #666;">확인된 영역 없음</h4>
                        <p style="margin: 0; font-size: 13px;">조회된 범위에서는 관련 영역이 없지만, 일부 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.</p>
                    </div>
                `);
            } else {
                marker.setPopupContent(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #2a9d8f;">국가유산 관련 영역 외 지역</h4>
                        <p style="margin: 0; font-size: 13px;"><b>확인 결과:</b> 🟢 관련 영역에 포함되지 않습니다.</p>
                    </div>
                `);
            }
        }

        // ---------------------------------------------------------------
        // 결과 공유
        // - 링크: 진단한 위치(+ 공사 종류·면적 입력)를 주소창에 담음. 결과를 저장하지 않고, 열 때 그 시점 데이터로 다시 진단
        // - PDF: 브라우저 인쇄로 결과 패널만 출력 (펼쳐보기는 모두 펼침, 진단 일시·링크·출처 포함)
        // ---------------------------------------------------------------
        function buildShareUrl() {
            const url = new URL(window.location.pathname, window.location.origin);
            if (!shareLocation) return url.toString();

            url.searchParams.set('lat', shareLocation.lat.toFixed(6));
            url.searchParams.set('lng', shareLocation.lng.toFixed(6));

            const workInput = document.getElementById('work-type');
            // 입력값은 패널이 지금 위치의 결과일 때만 담음 (다른 곳을 눌러 진단 중이면 이전 입력을 섞지 않음)
            if (workInput && panelLocation === shareLocation && lastParcelResult && lastParcelResult.parcel) {
                if (workInput.value) url.searchParams.set('work', workInput.value);
                // 사업 면적은 필지 면적과 다르게 고쳤을 때만 담음
                const area = readNumber('land-area');
                if (area !== null && area !== Math.round(lastParcelResult.parcel.area)) url.searchParams.set('area', area);
                const floor = readNumber('floor-area');
                if (workInput.value === 'business' && floor !== null) url.searchParams.set('floor', floor);
                const ground = readElevation('ground-level');
                if (ground !== null) url.searchParams.set('ground', ground);
                const depth = readNumber('dig-depth');

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>땅파기전</title>
    
    <!-- 1. Leaflet CSS 스타일 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* 지도를 담을 div는 반드시 높이(height)가 있어야 함! */
        #map { 
            width: 100%; 
            height: 480px; 
        }
    </style>
</head>
<body>    
    <!-- 2. 지도가 들어갈 공간 -->
    <div id="map"></div>

    <!-- 주소 검색 UI 패널 -->
    <div id="search-box" style="margin-bottom: 10px; z-index: 1000; position: relative;">
        <input
            type="text"
            id="address-input"
            placeholder="예:서울시청 또는 서울시 종로구"
            style="width: 300px; padding: 8px; font-size: 14px;"
        >
        <button
            id="search-btn"
            style="padding: 8px 15px; font-size: 14px; cursor: pointer;"
        >
            검색
        </button>
    </div>

    <!-- 3. Leaflet 자바스크립트 불러오기 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Point-in-Polygon(leaflet-pip) 외부 라이브러리 CDN 링크 -->
    <script src="https://unpkg.com/@mapbox/leaflet-pip@latest/leaflet-pip.js"></script>

    <script>
        // 지도 초기화 (서울 시청 위경도 좌표 [37.5665, 126.9780], 줌 레벨 13)
        const map = L.map('map').setView([37.5665, 126.9780], 13);

        // 오픈스트리트맵(무료 배경 지도) 입히기
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // VWorld 지적도 WMS 레이어 생성
        const cadastralLayer = L.tileLayer.wms(
            '/api/vworld',
            {
                service: 'WMS',
                request: 'GetMap',
                version: '1.3.0',

                // BUBBLE이 아니라 BUBUN
                layers: 'lp_pa_cbnd_bubun,lp_pa_cbnd_bonbun',

                // 잘못된 스타일명을 보내지 않고 기본 스타일 사용
                styles: '',

                format: 'image/png',
                transparent: true,
                crs: L.CRS.EPSG3857,

                minZoom: 11,
                maxZoom: 19
            }
        ).addTo(map);

        // 지도 컨트롤 버튼 생성
        const overlayMaps = {
            "지적도 표시": cadastralLayer
        };
        L.control.layers(null, overlayMaps).addTo(map);

        // 브라우저의 Geolocation 기능 지원 확인
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;   // 위도
                    const lng = position.coords.longitude; // 경도

                    console.log("내 위치:", lat, lng);

                    // 지도의 중심을 내 위치로 이동 (줌 레벨 15)
                    map.setView([lat, lng], 15);

                    // 내 위치에 마커 꽂기
                    const marker = L.marker([lat, lng]).addTo(map);
                    marker.bindPopup('내 위치').openPopup();
                },
                function(error) {
                    console.warn("위치 정보를 가져올 수 없습니다: ", error.message);
                    alert("위치 정보 권한이 거부되었거나 지원되지 않습니다. 서울시청 기준으로 표시됩니다.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        } else {
            alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
        }

        // 검색창 이벤트
        const addressInput = document.getElementById('address-input');
        addressInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('search-btn').click();
            }
        });

        document.getElementById('search-btn').addEventListener('click', function() {
            const keyword = document.getElementById('address-input').value;
            
            if (!keyword) {
                alert("검색할 주소를 입력해주세요!");
                return;
            }

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        console.log("검색된 좌표:", lat, lon);

                        map.setView([lat, lon], 16);

                        const searchMarker = L.marker([lat, lon]).addTo(map);
                        searchMarker.bindPopup(`<b>검색 결과:</b><br>${data[0].display_name}`).openPopup();
                    } else {
                        alert("해당 주소를 찾을 수 없습니다. 다른 검색어로 시도해 보세요!");
                    }
                })
                .catch(error => {
                    console.error("주소 검색 중 에러 발생:", error);
                    alert("주소 검색에 실패했습니다.");
                });
        });

        // 외부 GeoJSON 파일로부터 문화재 유존지역 불러오기
    let heritageLayer = null;

    fetch('./data/heritage-zones.geojson')
        .then(response => {
            if (!response.ok) {
                throw new Error('GeoJSON 파일을 불러오지 못했습니다.');
            }

            return response.json();
        })
        .then(data => {
            heritageLayer = L.geoJSON(data, {
                style: {
                    color: '#e63946',
                    weight: 2,
                    fillColor: '#ffb703',
                    fillOpacity: 0.5
                }
            }).addTo(map);

            console.log('문화재 유존지역 불러오기 성공:', data);
        })
        .catch(error => {
            console.error('GeoJSON 불러오기 오류:', error);
        });
        

        let clickMarker = null;

        map.on('click', function(e) {
            // GeoJSON이 아직 로딩되지 않았으면 클릭 처리 중단
            if (!heritageLayer) {
                alert('문화재 유존지역 데이터를 불러오는 중입니다.');
                return;
            }
            if (clickMarker) map.removeLayer(clickMarker);

            const clickedLatlng = e.latlng;
            clickMarker = L.marker(clickedLatlng).addTo(map);

            const results = leafletPip.pointInLayer(clickedLatlng, heritageLayer);

            if (results.length > 0) {
                const zoneName = results[0].feature.properties.name || "인근 문화재 확인 영역";
                clickMarker.bindPopup(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #e63946;">${zoneName}</h4>
                        <p style="margin: 0; font-size: 13px;"><b>진단 결과:</b> 🔴 확인 결과: 관련 영역에 포함됩니다.</p>
                    </div>
                `).openPopup();
            } else {
                clickMarker.bindPopup(`
                    <div style="padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #2a9d8f;">유존구역 외 지역</h4>
                        <p style="margin: 0; font-size: 13px;"><b>진단 결과:</b> 🟢 확인 결과: 관련 영역에 포함되지 않습니다.</p>
                    </div>
                `).openPopup();
            }
        });
    </script>
</body>
</html>
